name: Grip R19 temporary patch
on:
  push:
    branches: [dev]
    paths:
      - 'qa/apply-grip-r19-temp.mjs'
      - 'qa-grip-jturn-legacy-r19.mjs'
      - '.github/workflows/grip-r19-temp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Grip R19
        run: node qa/apply-grip-r19-temp.mjs
      - name: Focused J-turn legacy QA
        run: |
          node --check src/driving-runtime-base.js
          node qa-grip-jturn-legacy-r19.mjs
          node qa-grip-ev-maneuver-r18.mjs
          node qa-grip-ev-jturn-r17.mjs
          node qa-grip-braking-r9.mjs
          node qa-grip-countersteer-r7.mjs
          node qa-grip-drift-r4.mjs
          node qa/V21_27_J_TURN_PORTLAND_QA.mjs
          node qa/V21_29_BODY_RELATIVE_TRANSMISSION_QA.mjs
      - name: Full driving and stress QA
        run: |
          node qa/DEV_DRIVING_SIM_QA.mjs
          npm run qa:stress
          npm run build
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/driving-runtime-base.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Grip R19: remove legacy 90-degree J-turn wall'
          git push origin HEAD:dev
