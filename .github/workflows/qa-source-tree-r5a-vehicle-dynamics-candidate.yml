name: Source Tree R5a Vehicle Dynamics Candidate

on:
  push:
    branches:
      - cleanup/source-tree-r5a-vehicle-dynamics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: R5a vehicle dynamics boundary QA
        run: node qa-source-tree-r5a-vehicle-dynamics.mjs
      - name: Runtime import/source-tree audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Vehicle dynamics ownership QA
        run: node qa-vehicle-dynamics-c1.mjs
      - name: Momentum ownership QA
        run: node qa-momentum-direction-b4.mjs
      - name: Wheelspin ownership QA
        run: node qa-wheelspin-state-b6.mjs
      - name: Full V21.31 regression stress
        run: npm run qa:stress
      - name: Driving dynamics simulation matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Grip R21 front-slip counter-yaw QA
        run: node qa-grip-f1-front-slip-r21.mjs
      - name: Grip R22 steering compression QA
        run: node qa-grip-f1-steering-r22.mjs
      - name: Grip R23 legacy F1 authority QA
        run: node qa-grip-f1-legacy-r23.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
