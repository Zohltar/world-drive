name: Temporary Issue 4 Sync Winding Patch

on:
  push:
    branches:
      - candidate/issue4-transition-winding-r2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch P9.25 sync transition winding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/terrain-p925.js')
          source = path.read_text()
          pattern = re.compile(
              r"(?m)^(?P<indent>[ \t]*)if\(triangleClear\(a,c,b\)\)indices\.push\(a,c,b\);\n"
              r"(?P=indent)if\(triangleClear\(b,c,d\)\)indices\.push\(b,c,d\);"
          )
          match = pattern.search(source)
          if not match:
              raise SystemExit('sync transition index block not found')
          indent = match.group('indent')
          replacement = "\n".join([
              f"{indent}const pushUpwardTriangle=(i0,i1,i2)=>{{",
              f"{indent}  if(side<0)indices.push(i0,i1,i2);",
              f"{indent}  else indices.push(i0,i2,i1);",
              f"{indent}}};",
              f"{indent}if(triangleClear(a,c,b))pushUpwardTriangle(a,c,b);",
              f"{indent}if(triangleClear(b,c,d))pushUpwardTriangle(b,c,d);",
          ])
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'expected one replacement, got {count}')
          path.write_text(source)
          PY
          git diff --check
      - name: Commit focused patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/terrain-p925.js
          git commit -m "Fix Photo OFF sync transition winding"
          git push origin HEAD:candidate/issue4-transition-winding-r2
