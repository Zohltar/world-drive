name: Apply Terrain R2 road imagery alignment

on:
  push:
    branches:
      - terrain/v21.31
    paths:
      - 'tools/apply-terrain-r2.mjs'
      - 'qa-terrain-r2-road-imagery.mjs'
      - '.github/workflows/terrain-r2-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply Terrain R2
        run: node tools/apply-terrain-r2.mjs
      - name: Terrain R2 road imagery QA
        run: node qa-terrain-r2-road-imagery.mjs
      - name: Terrain R1/R2 and current regression gates
        run: |
          node qa-terrain-r1-legacy-ownership.mjs
          node qa/V21_31_LEGACY_TERRAIN_AUTHORITY_QA.mjs
          node qa/V21_31_ROAD_SMOOTHING_QA.mjs
          npm run qa:stress
      - name: Production build
        run: npm run build
      - name: Commit Terrain R2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/terrain-p925.js src/imagery.js src/main.js
          git commit -m "Terrain R2: align satellite geometry to refined road earthwork"
          git push
