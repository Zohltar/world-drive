name: Audit A7 repository hygiene
on:
  push:
    branches: ['audit/code-debt-a7']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: A6 branding regression
        run: node qa-version-branding-a6.mjs
      - name: A7 repository hygiene
        run: node qa-repo-hygiene-a7.mjs
      - name: Runtime import/debt audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
