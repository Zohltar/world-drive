name: Cleanup B7 legacy yaw authority audit

on:
  push:
    branches:
      - audit/legacy-yaw-b7
    paths:
      - 'qa/legacy-yaw-b7-audit-temp.mjs'
      - '.github/workflows/legacy-yaw-b7-audit-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node qa/legacy-yaw-b7-audit-temp.mjs
