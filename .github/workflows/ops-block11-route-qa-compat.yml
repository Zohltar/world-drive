name: Ops Block 11 Route QA Compatibility

on:
  push:
    branches:
      - ops/block11-route-qa-compat
    paths:
      - .github/workflows/ops-block11-route-qa-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/block11-laguna-seca-r1
          fetch-depth: 0
      - name: Update legacy narrow-facade assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('qa/V21_26_ROUTE_LIFECYCLE_REFACTOR_QA.mjs')
          lines=path.read_text(encoding='utf-8').splitlines()
          changed_main=0
          changed_lifecycle=0
          for i,line in enumerate(lines):
              if "main.js createRequestedRoute facade is not narrow" in line:
                  if "waypoints=\\[\\]" not in line or "routeLifecycle\\.createRequestedRoute\\(start,end,waypoints\\)" not in line:
                      raise SystemExit(f'Unexpected main facade assertion: {line}')
                  line=line.replace("waypoints=\\[\\]", "waypoints=\\[\\],options=\\{\\}")
                  line=line.replace("routeLifecycle\\.createRequestedRoute\\(start,end,waypoints\\)", "routeLifecycle\\.createRequestedRoute\\(start,end,waypoints,options\\)")
                  lines[i]=line
                  changed_main+=1
              elif line.strip()==r'/async function createRequestedRoute\(start,end,waypoints=\[\]\)\{/,' :
                  lines[i]=line.replace(r'waypoints=\[\]',r'waypoints=\[\],options=\{\}')
                  changed_lifecycle+=1
          if changed_main!=1 or changed_lifecycle!=1:
              raise SystemExit(f'Expected one update each, got main={changed_main}, lifecycle={changed_lifecycle}')
          path.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Commit QA compatibility update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/V21_26_ROUTE_LIFECYCLE_REFACTOR_QA.mjs
          git diff --cached --check
          git commit -m "QA: allow authored route options through lifecycle facade"
          git push origin HEAD:candidate/block11-laguna-seca-r1
