name: Tune WRX rear night lights

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/wrx-tail-tune.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increase WRX night running tail brightness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/wrx-glb.js')
          s=p.read_text(encoding='utf-8')
          old="const runningIntensity=night>.06 ? (.55+night*3.25) : .02;"
          new="const runningIntensity=night>.06 ? (.90+night*3.60) : .02;"
          if old not in s:
              raise SystemExit('Expected WRX running-tail intensity contract not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          grep -F "const runningIntensity=night>.06 ? (.90+night*3.60) : .02;" src/wrx-glb.js
          rm -f .github/workflows/wrx-tail-tune.yml

      - name: Commit WRX lighting adjustment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wrx-glb.js .github/workflows/wrx-tail-tune.yml
          git commit -m "WRX: brighten rear night running lights"
          git push origin HEAD:dev
