name: R4 Vehicle Migration One-Shot

on:
  push:
    branches:
      - cleanup/source-tree-r4-vehicles
    paths:
      - 'scripts/r4-migrate-once.mjs'
      - '.github/workflows/r4-migrate-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Prepare atomic R4 source-tree move
        run: node scripts/r4-migrate-once.mjs
      - name: Refresh current placement QA contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='qa/V21_26_VEHICLE_PLACEMENT_REFACTOR_QA.mjs';
          let text=fs.readFileSync(file,'utf8');
          const replacements=[
            [
              String.raw`/const placedFrame=roadProfileFrameAtCum\(p\.cum\)/,`,
              String.raw`/const placedFrame=roadProfileFrameAtCum\(targetCum\)/,`
            ],
            [
              String.raw`/placedFrame\?\.y\?\?roadHeightAt\(state\.absX,state\.absZ\)/,`,
              String.raw`/const roadY=validPlacedFrame[\s\S]*?\?Number\(placedFrame\.y\)[\s\S]*?:roadHeightAt\(state\.absX,state\.absZ\)/,`
            ],
            [
              'roadProfileFrameAtCum:cum=>({x:11,z:21,angle:.4,y:5,cum}),',
              'roadProfileFrameAtCum:cum=>({px:11,pz:21,pitch:0,angle:.4,y:5,cum}),' 
            ]
          ];
          for(const [from,to] of replacements){
            if(!text.includes(from))throw new Error(`R4 placement QA contract missing: ${from}`);
            text=text.replace(from,to);
          }
          fs.writeFileSync(file,text);
          console.log('R4 placement QA contract refreshed');
          NODE
      - name: R4 post-move audit
        run: node qa-source-tree-r4-vehicles-audit.mjs
      - name: Runtime import/source-tree audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Lazy authored GLB QA
        run: node qa/V21_31_LAZY_GLB_QA.mjs
      - name: Multiplayer authored registry QA
        run: node qa/V21_31_MULTIPLAYER_M3_REGISTRY_QA.mjs
      - name: Multiplayer authored adapter QA
        run: node qa/V21_31_MULTIPLAYER_M4_ADAPTER_QA.mjs
      - name: Truck trailer regression QA
        run: node qa/V21_23_0_TRUCK_TRAILER_QA.mjs
      - name: Vehicle placement refactor QA
        run: node qa/V21_26_VEHICLE_PLACEMENT_REFACTOR_QA.mjs
      - name: Route placement finite QA
        run: node qa/V21_31_ROUTE_PLACEMENT_FINITE_QA.mjs
      - name: Production build
        run: npm run build
      - name: Commit atomic migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "R4: move vehicle source tree"
          git push origin HEAD:cleanup/source-tree-r4-vehicles
