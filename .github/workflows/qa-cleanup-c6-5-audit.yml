name: Cleanup C6.5 Remaining Diagnostic Globals Audit

on:
  push:
    branches:
      - audit/diagnostics-c6-5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: C6.5 remaining diagnostic-global inventory
        run: node qa-diagnostics-c6-5-audit.mjs
      - name: C6.1 diagnostics root regression
        run: node qa-diagnostics-c6-1.mjs
      - name: C6.2 presentation diagnostics regression
        run: node qa-diagnostics-c6-2.mjs
      - name: C6.3 wheelspin diagnostics regression
        run: node qa-diagnostics-c6-3.mjs
      - name: C6.4 road-sign diagnostics regression
        run: node qa-diagnostics-c6-4.mjs
      - name: Runtime import and debt audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
