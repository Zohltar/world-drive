name: R5b Transmission State Candidate QA

on:
  push:
    branches:
      - candidate/r5b-transmission-state
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: R5b transmission state source-tree boundary
        run: node qa/qa-source-tree-r5b-transmission-state.mjs
      - name: Runtime import and debt audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Transmission C2 ownership and exact gear
        run: node qa/qa-transmission-c2.mjs
      - name: V21.26 transmission controller boundary
        run: node qa/V21_26_TRANSMISSION_REFACTOR_QA.mjs
      - name: Autopilot transmission regression
        run: node qa/V21_26_AUTOPILOT_TRANSMISSION_QA.mjs
      - name: Body-relative transmission regression
        run: node qa/V21_29_BODY_RELATIVE_TRANSMISSION_QA.mjs
      - name: Clutch bridge regression
        run: node qa/V21_29_CLUTCH_BRIDGE_QA.mjs
      - name: DNR brake selector regression
        run: node qa/V21_29_DNR_BRAKE_SELECTOR_QA.mjs
      - name: Transmission direction regression
        run: node qa/V21_29_TRANSMISSION_DIRECTION_QA.mjs
      - name: Multiplayer local gear diagnostics
        run: node qa/qa-diagnostics-c6-7.mjs
      - name: Multiplayer wire diagnostics
        run: node qa/qa-diagnostics-c6-8.mjs
      - name: Multiplayer M4 adapter exact gear
        run: node qa/V21_31_MULTIPLAYER_M4_ADAPTER_QA.mjs
      - name: Multiplayer controller runtime
        run: node qa/V21_31_MULTIPLAYER_M412_CONTROLLER_RUNTIME_QA.mjs
      - name: Multiplayer reverse E2E
        run: node qa/V21_31_MULTIPLAYER_M411_REVERSE_E2E_QA.mjs
      - name: Multiplayer reverse burst snapshot
        run: node qa/V21_31_MULTIPLAYER_M413_REVERSE_BURST_SNAPSHOT_QA.mjs
      - name: Full regression stress
        run: npm run qa:stress
      - name: Driving dynamics simulation matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
