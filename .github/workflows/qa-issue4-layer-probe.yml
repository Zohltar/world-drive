name: Issue 4 Layer Probe QA

on:
  push:
    branches:
      - candidate/issue4-layer-probe-r4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: World scene C5.3 QA
        run: node qa/qa-world-scene-c53.mjs
      - name: R8 world-scene source-tree QA
        run: node qa/qa-source-tree-r8-world-scene.mjs
      - name: C6 global boundary QA
        run: node qa/qa-diagnostics-c6-final-inventory.mjs
      - name: R8 streaming baseline aggregate
        run: node qa/qa-r8-streaming-baseline.mjs
      - name: Runtime import and source-tree audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
