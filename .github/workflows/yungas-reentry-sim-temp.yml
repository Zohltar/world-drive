name: Yungas offroad reentry simulation

on:
  push:
    branches:
      - qa/yungas-reentry-r13
    paths:
      - 'qa/yungas-reentry-sim-temp.mjs'
      - '.github/workflows/yungas-reentry-sim-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Run Yungas offroad reentry matrix
        run: node qa/yungas-reentry-sim-temp.mjs
