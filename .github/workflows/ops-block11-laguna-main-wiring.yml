name: Ops Block 11 Laguna Main Wiring

on:
  push:
    branches:
      - ops/block11-laguna-main-wiring
    paths:
      - .github/workflows/ops-block11-laguna-main-wiring.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/block11-laguna-seca-r1
          fetch-depth: 0

      - name: Wire circuit preset through main facade
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/main.js')
          text=path.read_text(encoding='utf-8')
          replacements=[
            (
              "  YUNGAS_START,\n  YUNGAS_END,\n  YUNGAS_WAYPOINTS\n} from './route-presets.js';",
              "  YUNGAS_START,\n  YUNGAS_END,\n  YUNGAS_WAYPOINTS,\n  LAGUNA_SECA_START,\n  LAGUNA_SECA_END,\n  LAGUNA_SECA_CIRCUIT\n} from './route-presets.js';"
            ),
            (
              "let ROUTE_WAYPOINTS=[];\nconst EARTH=6378137;",
              "let ROUTE_WAYPOINTS=[];\nlet ROUTE_AUTHORED_COORDINATES=null;\nlet ROUTE_AUTHORED_PROVIDER=null;\nconst EARTH=6378137;"
            ),
            (
              "async function createRequestedRoute(start,end,waypoints=[]){\n  return routeLifecycle.createRequestedRoute(start,end,waypoints);\n}",
              "async function createRequestedRoute(start,end,waypoints=[],options={}){\n  return routeLifecycle.createRequestedRoute(start,end,waypoints,options);\n}"
            ),
            (
              "    routeStart:ROUTE_START,\n    routeEnd:ROUTE_END,\n    routeWaypoints:ROUTE_WAYPOINTS,\n    origin,",
              "    routeStart:ROUTE_START,\n    routeEnd:ROUTE_END,\n    routeWaypoints:ROUTE_WAYPOINTS,\n    routeAuthoredCoordinates:ROUTE_AUTHORED_COORDINATES,\n    routeAuthoredProvider:ROUTE_AUTHORED_PROVIDER,\n    origin,"
            ),
            (
              "    if('routeStart' in state)ROUTE_START=state.routeStart;\n    if('routeEnd' in state)ROUTE_END=state.routeEnd;\n    if('routeWaypoints' in state)ROUTE_WAYPOINTS=state.routeWaypoints;\n    if('origin' in state)origin=state.origin;",
              "    if('routeStart' in state)ROUTE_START=state.routeStart;\n    if('routeEnd' in state)ROUTE_END=state.routeEnd;\n    if('routeWaypoints' in state)ROUTE_WAYPOINTS=state.routeWaypoints;\n    if('routeAuthoredCoordinates' in state)ROUTE_AUTHORED_COORDINATES=state.routeAuthoredCoordinates;\n    if('routeAuthoredProvider' in state)ROUTE_AUTHORED_PROVIDER=state.routeAuthoredProvider;\n    if('origin' in state)origin=state.origin;"
            ),
            (
              "  YUNGAS_START,\n  YUNGAS_END,\n  YUNGAS_WAYPOINTS\n});",
              "  YUNGAS_START,\n  YUNGAS_END,\n  YUNGAS_WAYPOINTS,\n  LAGUNA_SECA_START,\n  LAGUNA_SECA_END,\n  LAGUNA_SECA_CIRCUIT\n});"
            ),
          ]
          for old,new in replacements:
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:120]!r}')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY

      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git diff --cached --check
          git commit -m "Routing: wire Laguna Seca preset into app"
          git push origin HEAD:candidate/block11-laguna-seca-r1
