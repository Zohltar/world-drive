name: Multiplayer HD QA

on:
  push:
    branches:
      - multiplayer
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Multiplayer compatibility QA
        run: node qa/V21_31_MULTIPLAYER_COMPAT_QA.mjs
      - name: Multiplayer lazy HD isolation QA
        run: node qa/V21_31_MULTIPLAYER_GLB_ISOLATION_QA.mjs
      - name: Production build
        run: npm run build
