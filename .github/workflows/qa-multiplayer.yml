name: Multiplayer M4 QA

on:
  push:
    branches:
      - multiplayer
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: M3 vehicle metric registry QA
        run: node qa/V21_31_MULTIPLAYER_M3_REGISTRY_QA.mjs
      - name: M3 multi-axle support QA
        run: node qa/V21_31_MULTIPLAYER_M3_SUPPORT_QA.mjs
      - name: M4 client and entrypoint QA
        run: node qa/V21_31_MULTIPLAYER_M3_CLIENT_QA.mjs
      - name: M3 protocol parity QA
        run: node qa/V21_31_MULTIPLAYER_M3_PROTOCOL_QA.mjs
      - name: M4.11 reverse relay end-to-end QA
        run: node qa/V21_31_MULTIPLAYER_M411_REVERSE_E2E_QA.mjs
      - name: M4.12 authored controller runtime QA
        run: node qa/V21_31_MULTIPLAYER_M412_CONTROLLER_RUNTIME_QA.mjs
      - name: M4.13 reverse snapshot and burst QA
        run: node qa/V21_31_MULTIPLAYER_M413_REVERSE_BURST_SNAPSHOT_QA.mjs
      - name: M4.14 WebGL reverse pixel QA
        shell: bash
        run: |
          npx vite --host 127.0.0.1 --port 5187 --strictPort >/tmp/m414-vite.log 2>&1 &
          VITE_PID=$!
          cleanup(){
            kill "$VITE_PID" >/dev/null 2>&1 || true
            cat /tmp/m414-vite.log || true
          }
          trap cleanup EXIT
          READY=0
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:5187/qa/m414-render.html >/dev/null 2>&1; then READY=1; break; fi
            sleep 0.1
          done
          if [ "$READY" != "1" ]; then
            echo "Vite M4.14 harness did not start"
            exit 1
          fi
          xvfb-run -a ./node_modules/.bin/electron --no-sandbox qa/m414-electron-main.cjs
      - name: Sonata authored lamp UV QA
        run: node qa/V21_31_SONATA_AUTHORED_LAMP_UV_QA.mjs
      - name: Network lighting-state matrix QA
        run: node qa/V21_31_MULTIPLAYER_M3_LIGHTING_MATRIX_QA.mjs
      - name: M4 all-vehicle local-controller adapter QA
        run: node qa/V21_31_MULTIPLAYER_M4_ADAPTER_QA.mjs
      - name: Multiplayer GLB structure audit
        run: node qa/V21_31_MULTIPLAYER_GLB_STRUCTURE_AUDIT.mjs
      - name: All-car physics regression QA
        run: node qa/V21_28_ALL_CARS_PHYSICS_QA.mjs
      - name: Production build
        run: npm run build
