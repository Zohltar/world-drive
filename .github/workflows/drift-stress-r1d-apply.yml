name: Apply Drift Stress R1d surface physics

on:
  push:
    branches:
      - drift-stress/v21.31
    paths:
      - 'tools/fix-drift-patcher-r1d.mjs'
      - '.github/workflows/drift-stress-r1d-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Correct temporary patcher
        run: |
          node tools/fix-drift-patcher-r1.mjs
          node tools/fix-drift-patcher-r1c.mjs
          node tools/fix-drift-patcher-r1d.mjs
      - name: Apply drift surface transition cleanup
        run: node tools/apply-drift-stress-r1.mjs
      - name: Point stress QA at runtime J-turn helper
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const p='qa-drift-surface-stress-r1.mjs';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace("import {\n  lateralDynamicsEnvelope,\n  jTurnTransientYawBlend\n} from './src/vehicle-dynamics-base.js';", "import {lateralDynamicsEnvelope} from './src/vehicle-dynamics-base.js';\nimport {jTurnTransientYawBlend} from './src/driving-runtime-base.js';");
          fs.writeFileSync(p,s);
          NODE
      - name: Drift surface stress matrix
        run: node qa-drift-surface-stress-r1.mjs
      - name: Existing grip power braking regression gates
        run: |
          node qa-grip-countersteer-r7.mjs
          node qa-grip-braking-r8.mjs
          node qa-grip-braking-r9.mjs
          node qa-grip-offroad-r5.mjs
          node qa-power-wrx-r2.mjs
          node qa/DEV_DRIVING_SIM_QA.mjs
          npm run qa:stress
      - name: Production build
        run: npm run build
      - name: Commit drift stress cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/tire-model.js src/physics/per-wheel-shadow-solver.js src/wheel-ground-support.js src/vehicle-presentation-v21.29.js src/vehicle-dynamics-base.js src/driving-runtime-base.js src/main.js qa-drift-surface-stress-r1.mjs
          git commit -m "Drift R10: continuous per-wheel road-dirt transitions"
          git push
