name: Post-refactor Electron IPC Origin QA

on:
  push:
    branches:
      - candidate/post-refactor-electron-ipc-origin-r1
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install
        run: npm ci

      - name: Block 5B Electron IPC caller-origin QA
        run: node qa/qa-post-refactor-electron-ipc-origin-r1.mjs

      - name: R2 multiplayer boundary QA
        run: node qa/qa-source-tree-r2-multiplayer.mjs

      - name: Block 5A LAN relay hardening regression
        run: node qa/qa-post-refactor-lan-relay-hardening-r1.mjs

      - name: M3 multiplayer client contract
        run: node qa/V21_31_MULTIPLAYER_M3_CLIENT_QA.mjs

      - name: M3 multiplayer protocol parity
        run: node qa/V21_31_MULTIPLAYER_M3_PROTOCOL_QA.mjs

      - name: Full Dev Integration audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs

      - name: Production build
        run: npm run build

      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs

      - name: Electron package smoke
        run: npx electron-forge package --platform=linux --arch=x64
