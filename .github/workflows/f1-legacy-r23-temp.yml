name: Validate F1 legacy cleanup R23

on:
  push:
    branches:
      - audit/f1-steering-r22-1
    paths:
      - 'qa/apply-f1-legacy-cleanup-r23-temp.mjs'
      - 'qa-grip-f1-legacy-r23.mjs'
      - '.github/workflows/f1-legacy-r23-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply R23
        run: node qa/apply-f1-legacy-cleanup-r23-temp.mjs
      - name: F1 ownership and steering regressions
        run: |
          node qa-grip-f1-legacy-r23.mjs
          node qa-grip-f1-front-slip-r21.mjs
          node qa-grip-f1-steering-r22.mjs
          node qa-grip-countersteer-r7.mjs
          node qa-grip-braking-r8.mjs
          node qa-grip-high-speed-r11.mjs
          node qa-grip-fleet-high-speed-r12.mjs
      - name: Full driving and stress regression
        run: |
          node qa/DEV_DRIVING_SIM_QA.mjs
          npm run qa:stress
      - name: Current F1 aero / calibration invariants
        run: |
          node qa/V21_21_21_REAL_MASS_AERO_QA.mjs
          node qa/V21_21_26_BEHAVIOR_CALIBRATION_QA.mjs
          node qa-grip-jump-r6.mjs
      - name: Production build
        run: npm run build
      - name: Commit R23 candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/driving-runtime-base.js src/vehicle-dynamics-base.js src/vehicle-system.js qa-grip-f1-legacy-r23.mjs
          git diff --cached --quiet || git commit -m 'Grip R23: remove legacy drift authority from F1'
          git push
