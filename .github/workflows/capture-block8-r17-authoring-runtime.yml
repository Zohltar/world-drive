name: Block 8 R17 authoring runtime capture
on:
  push:
    branches: [candidate/block8-biome-classifier-r1]
    paths: [.github/workflows/capture-block8-r17-authoring-runtime.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the existing locked dependencies for local art inspection
        run: npm ci
      - name: Preserve only the pinned Three runtime and current text source
        run: |
          mkdir -p "$RUNNER_TEMP/r17-authoring"
          git rev-parse HEAD > "$RUNNER_TEMP/r17-authoring/tested-commit.txt"
          tar -czf "$RUNNER_TEMP/r17-authoring/three-runtime.tar.gz" node_modules/three
          git archive --format=tar.gz HEAD src tools qa index.html package.json package-lock.json vite.config.js docs .github > "$RUNNER_TEMP/r17-authoring/source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: r17-authoring-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/r17-authoring
          if-no-files-found: error
