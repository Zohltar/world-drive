name: Cleanup C5.6 Loaded Settings QA

on:
  push:
    branches:
      - dev
    paths:
      - 'src/main.js'
      - 'src/application-settings.js'
      - 'src/loaded-settings-application.js'
      - 'qa-main-c5-settings.mjs'
      - 'qa-main-c5-loaded-settings.mjs'
      - 'qa/V21_25_UI_INIT_ORDER_QA.mjs'
      - 'qa/V21_25_UI_REFACTOR_QA.mjs'
      - 'qa/V21_26_ENVIRONMENT_REFACTOR_QA.mjs'
      - '.github/workflows/qa-cleanup-c5-loaded-settings.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: C5.6 loaded settings semantics QA
        run: node qa-main-c5-loaded-settings.mjs
      - name: C5.5 stable settings identity QA
        run: node qa-main-c5-settings.mjs
      - name: V21.25 UI init-order QA
        run: node qa/V21_25_UI_INIT_ORDER_QA.mjs
      - name: V21.25 UI refactor QA
        run: node qa/V21_25_UI_REFACTOR_QA.mjs
      - name: V21.26 environment refactor QA
        run: node qa/V21_26_ENVIRONMENT_REFACTOR_QA.mjs
      - name: Runtime import and debt audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Driving dynamics simulation matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Full V21.31 regression stress
        run: npm run qa:stress
      - name: Production build
        run: npm run build
