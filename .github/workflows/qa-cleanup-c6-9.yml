name: Cleanup C6.9 Traffic-Network Diagnostics QA

on:
  push:
    branches:
      - cleanup/diagnostics-c6-9
      - dev
    paths:
      - 'src/traffic/civil-traffic-network-bridge.js'
      - 'src/diagnostics.js'
      - 'src/multiplayer.js'
      - 'src/transmission-network-state.js'
      - 'src/traffic/civil-traffic.js'
      - 'src/traffic/civil-traffic-local.js'
      - 'src/traffic/civil-traffic-pool.js'
      - 'src/traffic/civil-traffic-preload.js'
      - 'qa/qa-diagnostics-c6-*.mjs'
      - 'qa/qa-traffic-*.mjs'
      - 'qa/V21_29_DNR_BRAKE_SELECTOR_QA.mjs'
      - 'qa/V21_29_BODY_RELATIVE_TRANSMISSION_QA.mjs'
      - 'qa/V21_29_TRANSMISSION_DIRECTION_QA.mjs'
      - 'qa/V21_31_MULTIPLAYER_M3_PROTOCOL_QA.mjs'
      - 'qa/m415-*'
      - 'server/multiplayer-server.mjs'
      - '.github/workflows/qa-cleanup-c6-9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: C6.1-C6.9 diagnostics QA
        run: |
          node qa/qa-diagnostics-c6-1.mjs
          node qa/qa-diagnostics-c6-2.mjs
          node qa/qa-diagnostics-c6-3.mjs
          node qa/qa-diagnostics-c6-4.mjs
          node qa/qa-diagnostics-c6-5.mjs
          node qa/qa-diagnostics-c6-6.mjs
          node qa/qa-diagnostics-c6-7.mjs
          node qa/qa-diagnostics-c6-8.mjs
          node qa/qa-diagnostics-c6-9.mjs
      - name: C2 transmission ownership QA
        run: node qa/qa-transmission-c2.mjs
      - name: DNR and direction regressions
        run: |
          node qa/V21_29_DNR_BRAKE_SELECTOR_QA.mjs
          node qa/V21_29_BODY_RELATIVE_TRANSMISSION_QA.mjs
          node qa/V21_29_TRANSMISSION_DIRECTION_QA.mjs
      - name: Multiplayer exact-gear protocol QA
        run: node qa/V21_31_MULTIPLAYER_M3_PROTOCOL_QA.mjs
      - name: Civil traffic local, pool, and preload regressions
        run: |
          node qa/qa-traffic-r1.mjs
          node qa/qa-traffic-pool-r1.mjs
          node qa/qa-traffic-preload-p1.mjs
      - name: Shared multiplayer traffic regressions
        run: |
          node qa/qa-traffic-mp1.mjs
          node qa/qa-traffic-mp1-live.mjs
      - name: Driving dynamics simulation matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Full V21.31 regression stress
        run: npm run qa:stress
      - name: M4.15 network to WebGL reverse QA
        shell: bash
        run: |
          npx vite --host 127.0.0.1 --port 5188 --strictPort >/tmp/c69-m415-vite.log 2>&1 &
          VITE_PID=$!
          WORLD_DRIVE_MP_PORT=8081 node server/multiplayer-server.mjs >/tmp/c69-m415-relay.log 2>&1 &
          RELAY_PID=$!
          cleanup(){
            kill "$VITE_PID" "$RELAY_PID" >/dev/null 2>&1 || true
            echo "--- Vite ---"; cat /tmp/c69-m415-vite.log || true
            echo "--- Relay ---"; cat /tmp/c69-m415-relay.log || true
          }
          trap cleanup EXIT
          READY=0
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:5188/qa/m415-render.html >/dev/null 2>&1 && curl -fsS http://127.0.0.1:8081/ >/dev/null 2>&1; then READY=1; break; fi
            sleep 0.1
          done
          test "$READY" = "1"
          M415_URL=http://127.0.0.1:5188/qa/m415-render.html xvfb-run -a ./node_modules/.bin/electron --no-sandbox qa/m415-electron-main.cjs
      - name: Runtime import and debt audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
