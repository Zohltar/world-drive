name: Block 8 Rendered Boreal Manic R13 QA
on:
  push:
    branches: [candidate/block8-biome-classifier-r1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendered-boreal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESOLVE_SHA256: be36d6209e443038d02e309f0447c6e7f2a62f5fe60c605ffe90d064952f2a60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve R4 runtime and accepted model buffers
        run: node qa/qa-block8-rendered-pilot-boundary-r12.mjs
      - name: Boreal profile contracts and unchanged Nord contracts
        run: |
          mkdir -p "$RUNNER_TEMP/biome-r13"
          python qa/qa-block8-rendered-manic-network-r13.py
          node qa/qa-block8-rendered-manic-r13.mjs "$RUNNER_TEMP/biome-r13/unit-qa.json"
          node qa/qa-block8-rendered-pilot-r12.mjs
          node qa/qa-block8-rendered-route-owner-r12.mjs
      - name: Install existing project and build-only QA dependencies
        run: |
          npm ci
          python -m pip install numpy==2.2.6 rasterio==1.4.3 pyshp==2.3.1 shapely==2.1.2 playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Rebuild exact accepted Manic input from pinned source
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --connect-timeout 20 --max-time 180 --max-filesize 200000000 https://storage.googleapis.com/teow2016/Ecoregions2017.zip -o "$RUNNER_TEMP/Ecoregions2017.zip"
          echo "$RESOLVE_SHA256  $RUNNER_TEMP/Ecoregions2017.zip" | sha256sum --check --strict
          python tools/biomes/build-resolve-atlas.py --input "$RUNNER_TEMP/Ecoregions2017.zip" --output "$RUNNER_TEMP/atlas-r13" --cell-degrees 0.1 --expected-sha256 "$RESOLVE_SHA256"
          python tools/biomes/build-long-road-pilot-r10.py --source "$RUNNER_TEMP/Ecoregions2017.zip" --atlas "$RUNNER_TEMP/atlas-r13" --fixture qa/fixtures/biomes/manic-r10 --output "$RUNNER_TEMP/r10-input"
      - name: Pinned repackaging, exact tile bytes, reproducibility and negative cases
        run: |
          python qa/qa-block8-rendered-manic-builder-r13.py --r10-zip "$RUNNER_TEMP/r10-input/world-drive-biome-pilot-r10.zip" --output "$RUNNER_TEMP/biome-r13/package-qa.json"
          python tools/biomes/build-rendered-manic-r13.py --r10-zip "$RUNNER_TEMP/r10-input/world-drive-biome-pilot-r10.zip" --output "$RUNNER_TEMP/biome-r13/pilot"
          node qa/qa-block8-rendered-manic-window-r13.mjs "$RUNNER_TEMP/biome-r13/pilot" "$RUNNER_TEMP/biome-r13/window-qa.json"
      - name: Original polygons and full Vite game boreal summer winter OFF
        run: python qa/qa-block8-rendered-manic-browser-r13.py --pilot "$RUNNER_TEMP/biome-r13/pilot" --r10 "$RUNNER_TEMP/r10-input" --output "$RUNNER_TEMP/biome-r13/native"
      - name: Preserve exact source and validation evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/biome-r13"
          git rev-parse HEAD > "$RUNNER_TEMP/biome-r13/tested-commit.txt"
          git archive --format=tar.gz HEAD tools/biomes src/app/forest-visual-pilot.js src/app/biome-diagnostics.js src/scenery/scenery-renderer-p933.js src/scenery/biomes src/forest-proxy-assets.js src/forest-streaming-policy.js qa/qa-block8-rendered-manic-r13.mjs qa/qa-block8-rendered-manic-builder-r13.py qa/qa-block8-rendered-manic-browser-r13.py qa/qa-block8-rendered-manic-network-r13.py qa/qa-block8-rendered-manic-window-r13.mjs qa/fixtures/biomes/manic-r10 docs/WORLD_DRIVE_BLOCK8_RENDERED_MANIC_R13.md .github/workflows/qa-block8-rendered-manic-r13.yml > "$RUNNER_TEMP/biome-r13/r13-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biome-r13-rendered-${{ github.sha }}
          path: ${{ runner.temp }}/biome-r13
          if-no-files-found: error
