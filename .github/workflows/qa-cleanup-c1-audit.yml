name: Cleanup C1 Vehicle Dynamics Audit

on:
  push:
    branches:
      - audit/vehicle-dynamics-c1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Map dynamics layering references
        run: node qa-vehicle-dynamics-c1-audit.mjs
