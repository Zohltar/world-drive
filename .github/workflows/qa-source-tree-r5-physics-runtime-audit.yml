name: Source Tree R5 Physics Runtime Audit

on:
  push:
    branches:
      - audit/source-tree-r5-physics-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: R5 physics/runtime source-tree audit
        run: node qa-source-tree-r5-physics-runtime-audit.mjs
      - name: Runtime import/source-tree audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Vehicle dynamics ownership QA
        run: node qa-vehicle-dynamics-c1.mjs
      - name: Transmission ownership QA
        run: node qa-transmission-c2.mjs
      - name: Wheel-ground R14 re-entry QA
        run: node qa-wheel-ground-reentry-r14.mjs
      - name: Skid contact alignment QA
        run: node qa-skid-contact-alignment-r15.mjs
      - name: Full V21.31 regression stress
        run: npm run qa:stress
      - name: Driving dynamics simulation matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
