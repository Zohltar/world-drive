name: Grip R16 temporary patch
on:
  push:
    branches: [dev]
    paths:
      - 'qa/apply-grip-r16-temp.mjs'
      - 'qa-grip-fwd-power-r16.mjs'
      - '.github/workflows/grip-r16-temp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Grip R16
        run: node qa/apply-grip-r16-temp.mjs
      - name: Focused QA
        run: |
          node --check src/driving-runtime-base.js
          node qa-grip-fwd-power-r16.mjs
          node qa-grip-countersteer-r7.mjs
          node qa-grip-high-speed-r11.mjs
          node qa-grip-fleet-high-speed-r12.mjs
      - name: Driving and stress QA
        run: |
          node qa/DEV_DRIVING_SIM_QA.mjs
          npm run qa:stress
          npm run build
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/driving-runtime-base.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Grip R16: prevent FWD power-understeer counter-yaw'
          git push origin HEAD:dev
