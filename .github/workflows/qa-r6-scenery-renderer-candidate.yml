name: R6 Scenery Renderer Candidate QA

on:
  push:
    branches:
      - candidate/r6-scenery-renderer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: R6 scenery source-tree boundary
        run: node qa/qa-source-tree-r6-scenery-renderer.mjs
      - name: Runtime import and debt audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: P9.33-P9.35 scenery startup gate
        run: node qa/qa-forest-p933-startup-gate.mjs
      - name: P9.25 scenery/preparation boundary
        run: node qa/qa-streaming-p925-scenery-and-prep.mjs
      - name: Active forest policy/stress
        run: node qa/qa-forest-active-stress.mjs
      - name: Active forest runtime
        run: node qa/qa-forest-active-runtime.mjs
      - name: Forest P9.29 frame budget
        run: node qa/qa-forest-p929-frame-budget.mjs
      - name: Forest P9.35 startup/front load
        run: node qa/qa-forest-p935-front-startup.mjs
      - name: Forest P9.36 rolling prefetch
        run: node qa/qa-forest-p936-rolling-prefetch.mjs
      - name: Combined P9.37 frame pacing
        run: node qa/qa-p937-combined-frame-pacing.mjs
      - name: Prepared forest retention
        run: node qa/qa-p938-forest-retention.mjs
      - name: Hitch attribution
        run: node qa/qa-p939-hitch-attribution.mjs
      - name: Forest queue maintenance
        run: node qa/qa-forest-p940-maintenance.mjs
      - name: Frame runtime attribution
        run: node qa/qa-p941-frame-runtime-attribution.mjs
      - name: Browser long-frame attribution
        run: node qa/qa-p942-browser-long-frame.mjs
      - name: Full V21.31 regression stress
        run: npm run qa:stress
      - name: Driving dynamics simulation matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
