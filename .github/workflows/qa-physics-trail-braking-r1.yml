name: Physics Trail Braking R1

on:
  push:
    branches:
      - candidate/physics-trail-braking-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Laguna force-and-yaw trim diagnostics
        run: node qa/qa-physics-laguna-trail-brake-diagnostics-r1.mjs
      - name: Combined trail-braking allocation
        run: node qa/qa-physics-combined-trail-braking-r1.mjs
      - name: WRX tire stability baseline
        run: node qa/qa-grip-wrx-tire-stability-a2.mjs
      - name: Hard braking steering regression
        run: node qa/qa-grip-braking-r8.mjs
      - name: Uphill load-transfer regression
        run: node qa/qa-grip-uphill-r10.mjs
      - name: Low-speed lateral slide regression
        run: node qa/qa-issue13-low-speed-lateral-runtime-r2.mjs
      - name: Offline hydro to online OSM fallback regression
        run: node qa/qa-geofabrik-hydro-runtime-r1.mjs
      - name: Online OSM geometry finite-boundary regression
        run: node qa/qa-osm-geometry-finite-r1.mjs
      - name: Road surface and wheel-contact continuity
        run: |
          node qa/qa-road-surface-continuity-r1.mjs
          node qa/qa-p937-combined-frame-pacing.mjs
          node qa/qa-block11-laguna-seca-r2.mjs
          node qa/V21_26_WHEEL_GROUND_SUPPORT_REFACTOR_QA.mjs
      - name: Full driving matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Runtime import and source-tree audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
