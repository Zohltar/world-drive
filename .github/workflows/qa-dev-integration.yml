name: Dev Integration QA

on:
  push:
    branches:
      - dev
      - road/v21.31
      - traffic/v21.31
      - grip/v21.31
      - grip/v21.31-r7
      - grip/v21.31-r8
      - grip/v21.31-r9
      - terrain/v21.31
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Runtime import and debt audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Full V21.31 regression stress
        run: npm run qa:stress
      - name: Driving dynamics simulation matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Grip R2 physical handbrake recovery QA
        run: node qa-grip-handbrake-r1.mjs
      - name: Grip R3 speed-sensitive steering curve QA
        run: node qa-grip-steering-curve-r3.mjs
      - name: Grip R4 drift anti-spin cleanup QA
        run: node qa-grip-drift-r4.mjs
      - name: Grip R5 off-road lateral physics QA
        run: node qa-grip-offroad-r5.mjs
      - name: Grip R6 airborne physics QA
        run: node qa-grip-jump-r6.mjs
      - name: Grip R7 countersteer tire-force coupling QA
        run: node qa-grip-countersteer-r7.mjs
      - name: Grip R8 hard braking steering QA
        run: node qa-grip-braking-r8.mjs
      - name: Grip R9 reverse and J-turn braking QA
        run: node qa-grip-braking-r9.mjs
      - name: Grip R10 uphill load-transfer stability QA
        run: node qa-grip-uphill-r10.mjs
      - name: Grip R11 high-speed trajectory stability QA
        run: node qa-grip-high-speed-r11.mjs
      - name: Grip R12 fleet high-speed crab-drift QA
        run: node qa-grip-fleet-high-speed-r12.mjs
      - name: Grip R13 progressive high-speed steering input QA
        run: node qa-grip-steering-input-r13.mjs
      - name: Grip R14 road reentry vertical support QA
        run: node qa-wheel-ground-reentry-r14.mjs
      - name: Skid R15 per-vehicle tire-mark alignment QA
        run: node qa-skid-contact-alignment-r15.mjs
      - name: Terrain R1 visual ownership QA
        run: node qa-terrain-r1-legacy-ownership.mjs
      - name: Terrain R2 road imagery alignment QA
        run: node qa-terrain-r2-road-imagery.mjs
      - name: Road banking limits QA
        run: node qa-road-banking-r1.mjs
      - name: Sparse civil traffic QA
        run: node qa-traffic-r1.mjs
      - name: Civil traffic variety pool QA
        run: node qa-traffic-pool-r1.mjs
      - name: Civil traffic startup preload QA
        run: node qa-traffic-preload-p1.mjs
      - name: Shared multiplayer civil traffic QA
        run: node qa-traffic-mp1.mjs
      - name: Live shared multiplayer traffic QA
        run: node qa-traffic-mp1-live.mjs
      - name: Sonata night body lighting QA
        run: node qa-sonata-night-body-r1.mjs
      - name: WRX rear night running lights QA
        run: node qa-wrx-night-tail-r1.mjs
      - name: Crest launch regression
        run: node qa/V21_27_CREST_LAUNCH_QA.mjs
      - name: Oblique landing regression
        run: node qa/V21_27_OBLIQUE_LANDING_QA.mjs
      - name: Forest startup/front-load QA
        run: node qa-forest-p935-front-startup.mjs
      - name: Forest rolling prefetch QA
        run: node qa-forest-p936-rolling-prefetch.mjs
      - name: Combined frame-pacing QA
        run: node qa-p937-combined-frame-pacing.mjs
      - name: Prepared forest-retention QA
        run: node qa-p938-forest-retention.mjs
      - name: Hitch attribution QA
        run: node qa-p939-hitch-attribution.mjs
      - name: Forest queue maintenance QA
        run: node qa-forest-p940-maintenance.mjs
      - name: Frame-runtime attribution QA
        run: node qa-p941-frame-runtime-attribution.mjs
      - name: Browser long-frame attribution QA
        run: node qa-p942-browser-long-frame.mjs
      - name: Road-sign runtime QA
        run: node qa-road-signs-p930-runtime.mjs
      - name: M4.14 authored reverse WebGL pixel QA
        shell: bash
        run: |
          npx vite --host 127.0.0.1 --port 5187 --strictPort >/tmp/dev-m414-vite.log 2>&1 &
          VITE_PID=$!
          cleanup(){ kill "$VITE_PID" >/dev/null 2>&1 || true; cat /tmp/dev-m414-vite.log || true; }
          trap cleanup EXIT
          READY=0
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:5187/qa/m414-render.html >/dev/null 2>&1; then READY=1; break; fi
            sleep 0.1
          done
          test "$READY" = "1"
          xvfb-run -a ./node_modules/.bin/electron --no-sandbox qa/m414-electron-main.cjs
      - name: M4.15 network to WebGL reverse QA
        shell: bash
        run: |
          npx vite --host 127.0.0.1 --port 5188 --strictPort >/tmp/dev-m415-vite.log 2>&1 &
          VITE_PID=$!
          WORLD_DRIVE_MP_PORT=8081 node server/multiplayer-server.mjs >/tmp/dev-m415-relay.log 2>&1 &
          RELAY_PID=$!
          cleanup(){
            kill "$VITE_PID" "$RELAY_PID" >/dev/null 2>&1 || true
            echo "--- Vite ---"; cat /tmp/dev-m415-vite.log || true
            echo "--- Relay ---"; cat /tmp/dev-m415-relay.log || true
          }
          trap cleanup EXIT
          READY=0
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:5188/qa/m415-render.html >/dev/null 2>&1 && curl -fsS http://127.0.0.1:8081/ >/dev/null 2>&1; then READY=1; break; fi
            sleep 0.1
          done
          test "$READY" = "1"
          M415_URL=http://127.0.0.1:5188/qa/m415-render.html xvfb-run -a ./node_modules/.bin/electron --no-sandbox qa/m415-electron-main.cjs
      - name: Live route preset smoke
        continue-on-error: true
        run: node qa/STRESS_ROUTE_PRESETS_LIVE.mjs
      - name: Runtime dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
