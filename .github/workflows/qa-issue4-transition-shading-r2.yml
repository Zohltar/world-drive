name: Issue 4 Transition Shading R2 QA

on:
  push:
    branches:
      - candidate/issue4-transition-shading-r2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Issue 4 transition shading r2 QA
        run: node qa/qa-issue4-transition-shading-r2.mjs
      - name: P9.27 road transition QA
        run: node qa/qa-streaming-p927-road-transition.mjs
      - name: Current local-world ownership QA
        run: node qa/qa-local-world-current-a8.mjs
      - name: P9.23 prepared refresh QA
        run: node qa/qa-streaming-p923-prepared-refresh.mjs
      - name: P9.25 scenery and prep QA
        run: node qa/qa-streaming-p925-scenery-and-prep.mjs
      - name: R8 streaming baseline aggregate
        run: node qa/qa-r8-streaming-baseline.mjs
      - name: Runtime import and source-tree audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
