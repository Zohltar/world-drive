name: Ops Block 11 Laguna R2 Fix

on:
  push:
    branches:
      - ops/block11-laguna-r2-fix
    paths:
      - .github/workflows/ops-block11-laguna-r2-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch helper
        uses: actions/checkout@v4
        with:
          ref: ops/block11-laguna-r2-fix
          path: patch
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: candidate/block11-laguna-seca-r1
          path: work
          fetch-depth: 0
      - name: Apply Laguna Seca R2 correction
        working-directory: work
        run: |
          sed -i 's/if count != 3:/if count != 2:/' ../patch/ops/block11-laguna-r2-fix.py
          sed -i 's/expected 3 roadBedOptions calls/expected 2 roadBedOptions calls/' ../patch/ops/block11-laguna-r2-fix.py
          python ../patch/ops/block11-laguna-r2-fix.py
      - name: Commit candidate correction
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src qa/qa-block11-laguna-seca-r2.mjs
          git diff --cached --check
          git commit -m "Routing: fix Laguna Seca circuit fidelity"
          git push origin HEAD:candidate/block11-laguna-seca-r1
