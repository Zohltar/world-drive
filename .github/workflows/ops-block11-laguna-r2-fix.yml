name: Ops Block 11 Laguna R2 Fix

on:
  push:
    branches:
      - ops/block11-laguna-r2-fix
    paths:
      - .github/workflows/ops-block11-laguna-r2-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/block11-laguna-seca-r1
          fetch-depth: 0
      - name: Apply Laguna Seca R2 correction
        run: python "$GITHUB_WORKSPACE/../block11-laguna-r2-fix/ops/block11-laguna-r2-fix.py"
      - name: Commit candidate correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src qa/qa-block11-laguna-seca-r2.mjs
          git diff --cached --check
          git commit -m "Routing: fix Laguna Seca circuit fidelity"
          git push origin HEAD:candidate/block11-laguna-seca-r1
