name: Ops Block 11 Laguna R2 Fix

on:
  push:
    branches:
      - ops/block11-laguna-r2-fix
    paths:
      - .github/workflows/ops-block11-laguna-r2-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
