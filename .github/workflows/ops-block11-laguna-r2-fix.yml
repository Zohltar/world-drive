const routeLifecycle=await readFile(new URL('../src/routing/route-lifecycle.js',import.meta.url),'utf8');
const main=await readFile(new URL('../src/main.js',import.meta.url),'utf8');
const builder=await readFile(new URL('../src/local-world-builder-p925.js',import.meta.url),'utf8');
const asyncBuilder=await readFile(new URL('../src/local-world-builder.js',import.meta.url),'utf8');
const driving=await readFile(new URL('../src/driving-runtime.js',import.meta.url),'utf8');
const traffic=await readFile(new URL('../src/traffic/civil-traffic.js',import.meta.url),'utf8');

for(const field of ['routeKind','routeClosedLoop','routeRoadSpec','routeCivilTraffic']){
  assert.ok(routeLifecycle.includes(field),`route lifecycle missing circuit policy field ${field}`);
}
assert.match(main,/routeClosedLoop:ROUTE_CLOSED_LOOP/);
assert.match(main,/getRouteRoadSpec:\(\)=>ROUTE_ROAD_SPEC/);
assert.match(main,/getCivilTrafficEnabled:\(\)=>ROUTE_CIVIL_TRAFFIC/);
assert.match(builder,/asphaltWidthM/);
assert.match(builder,/!spec\.closedLoop&&profile\.length>1/,'circuits must not create an open-route departure pad');
assert.match(builder,/if\(spec\.centerLine\)/,'circuit road presentation must be able to suppress the highway center line');
assert.match(asyncBuilder,/originalRoadVolume\?\.\(prepared\.profile,rawSpec\)/,'P9.37 prebuild must use circuit road dimensions');
assert.match(driving,/isEnabled:args\.getCivilTrafficEnabled/);
assert.match(traffic,/if\(!routeTrafficEnabled\(\)\)\{/);
assert.match(traffic,/if\(!routeTrafficEnabled\(\)\)return false;/,'manual traffic spawn must stay disabled on circuits');

// Synthetic closed-loop geometry: first and last road cross-sections must occupy
// exactly the same place. This is what the old coordinate-only closure QA missed.
const points=[
  {x:0,z:0},{x:0,z:120},{x:120,z:120},{x:120,z:0},{x:0,z:0}
];
let cum=0;
const segments=[];
for(let i=1;i<points.length;i++){
  const a=points[i-1],b=points[i];
  const len=Math.hypot(b.x-a.x,b.z-a.z);
  segments.push({ax:a.x,az:a.z,bx:b.x,bz:b.z,len,cum});
  cum+=len;
}
const system=createRoadGeometrySystem({
  THREE,
  roadEdgeMat:new THREE.MeshBasicMaterial(),
  roadUnderMat:new THREE.MeshBasicMaterial(),
  ROAD_SURFACE_OFFSET:.10,
  terrainAbs:(x,z)=>x*.006+z*.004,
  nearestRoute:()=>({cum:0}),
  bridgeHeightAtCum:()=>null,
  bridgeManager:{isNearApproach:()=>false},
  getState:()=>({absX:0,absZ:0,routeLength:cum,segments,worldOffset:{x:0,z:0},routeClosedLoop:true})
});
const profile=system.buildProfile();
assert.ok(profile.length>20,'synthetic circuit profile unexpectedly sparse');
assert.ok(Math.hypot(profile[0].x-profile.at(-1).x,profile[0].z-profile.at(-1).z)<1e-6,'closed profile centreline seam moved apart');
assert.ok(Math.abs(profile[0].y-profile.at(-1).y)<1e-6,'closed profile seam height differs');
assert.ok(Math.abs(profile[0].roll-profile.at(-1).roll)<1e-6,'closed profile seam roll differs');

const ribbon=system.buildRibbon(profile,15,new THREE.MeshBasicMaterial(),.10);
const pos=ribbon.geometry.getAttribute('position').array;
const lastBase=(profile.length-1)*6;
for(let j=0;j<6;j++)assert.ok(Math.abs(pos[j]-pos[lastBase+j])<1e-4,`closed road cross-section seam differs at component ${j}`);

const volume=system.buildRoadVolume(profile,LAGUNA_SECA_CIRCUIT.roadSpec);
const edgePos=volume.children[0].geometry.getAttribute('position').array;
const leftTop=3*3;
const rightTop=4*3;
const width=Math.hypot(edgePos[leftTop]-edgePos[rightTop],edgePos[leftTop+2]-edgePos[rightTop+2]);
assert.ok(width>14.8&&width<16.0,`circuit road volume did not honor 15 m asphalt width: ${width}`);

console.log('BLOCK 11 LAGUNA SECA R2 FIDELITY QA: PASS',{profilePoints:profile.length,seamClosed:true,asphaltWidthM:Number(width.toFixed(2)),civilTraffic:false});
