name: Cleanup C5.3 World Scene Candidate

on:
  push:
    branches:
      - cleanup/main-c5-world-scene
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize C5.3 extraction
        run: |
          if grep -q "const world=new THREE.Group()," src/main.js; then
            node tools/cleanup-c5-world-scene.mjs
          else
            echo "C5.3 already materialized"
          fi
      - name: C5.3 world scene ownership and behavior QA
        run: node qa-main-c5-world-scene.mjs
      - name: Current local-world ownership QA
        run: node qa-local-world-current-a8.mjs
      - name: Terrain visual ownership QA
        run: node qa-terrain-r1-legacy-ownership.mjs
      - name: Terrain road imagery alignment QA
        run: node qa-terrain-r2-road-imagery.mjs
      - name: V21.31 road smoothing regression
        run: node qa/V21_31_ROAD_SMOOTHING_QA.mjs
      - name: V21.31 superelevation regression
        run: node qa/V21_31_SUPERELEVATION_QA.mjs
      - name: Driving dynamics simulation matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Full V21.31 regression stress
        run: npm run qa:stress
      - name: Production build
        run: npm run build
      - name: Diff hygiene
        run: git diff --check
      - name: Commit materialized C5.3 candidate
        run: |
          if git diff --quiet -- src/main.js; then
            echo "No materialized main.js change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git commit -m "Cleanup C5.3: move world scene out of main"
          git push origin HEAD:cleanup/main-c5-world-scene
