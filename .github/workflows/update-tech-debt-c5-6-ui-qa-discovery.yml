name: Update Tech Debt C5.6 UI QA Discovery

on:
  push:
    branches:
      - docs/c5-6-ui-qa-discovery
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/update-tech-debt-c5-6-ui-qa-discovery.mjs
      - shell: bash
        run: |
          if git diff --quiet -- docs/WORLD_DRIVE_TECH_DEBT_PLAN.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/WORLD_DRIVE_TECH_DEBT_PLAN.md
          git commit -m 'Docs: record C5.6 stale V21.25 UI QA discovery'
          git push
