name: QA Root Layout Migrate

on:
  push:
    branches:
      - cleanup/qa-root-layout
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Move root QA files into qa and retarget non-workflow references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, posixpath, re, subprocess

          root=Path('.')
          qa_dir=root/'qa'
          qa_dir.mkdir(exist_ok=True)
          qa_name=re.compile(r'^(?:qa[-_].*|.*_QA)\.(?:m?js)$',re.I)
          moved=[]
          for p in sorted(root.iterdir()):
            if p.is_file() and qa_name.match(p.name):
              target=qa_dir/p.name
              if target.exists():
                raise SystemExit(f'target already exists: {target}')
              subprocess.run(['git','mv',p.as_posix(),target.as_posix()],check=True)
              moved.append(p.name)
          if not moved:
            raise SystemExit('no root QA files found')

          mapping={name:f'qa/{name}' for name in moved}
          def norm(p): return posixpath.normpath(p.replace('\\','/'))
          def relspec(frm,to,had_trailing_slash=False):
            r=posixpath.relpath(to,posixpath.dirname(frm))
            if r=='.': r='./'
            elif not r.startswith('.'): r='./'+r
            if had_trailing_slash and not r.endswith('/'):
              r+='/'
            return r

          # Preserve module/new-URL targets exactly while each QA moves root -> qa/.
          patterns=[
            re.compile(r"(?P<prefix>\bfrom\s*)(?P<q>['\"])(?P<spec>\.\.?/[^'\"]*)(?P=q)"),
            re.compile(r"(?P<prefix>\bimport\s*)(?P<q>['\"])(?P<spec>\.\.?/[^'\"]*)(?P=q)"),
            re.compile(r"(?P<prefix>\bimport\s*\(\s*)(?P<q>['\"`])(?P<spec>\.\.?/[^'\"`]*) (?P=q)".replace('*) ', '* )').replace('* )','*)')),
            re.compile(r"(?P<prefix>\bnew\s+URL\s*\(\s*)(?P<q>['\"`])(?P<spec>\.\.?/[^'\"`]*) (?P=q)".replace('*) ', '* )').replace('* )','*)')),
          ]
          # Replace the two generated regexes above with straightforward compiled forms.
          patterns[2]=re.compile(r"(?P<prefix>\bimport\s*\(\s*)(?P<q>['\"`])(?P<spec>\.\.?/[^'\"`]*)(?P=q)")
          patterns[3]=re.compile(r"(?P<prefix>\bnew\s+URL\s*\(\s*)(?P<q>['\"`])(?P<spec>\.\.?/[^'\"`]*)(?P=q)")

          for name in moved:
            new_from=f'qa/{name}'
            old_from=name
            p=Path(new_from)
            text=p.read_text()
            out=text
            for rx in patterns:
              def repl(m):
                spec=m.group('spec')
                old_target=norm(posixpath.join(posixpath.dirname(old_from),spec))
                new_target=mapping.get(old_target,old_target)
                new_spec=relspec(new_from,new_target,spec.endswith('/'))
                return f"{m.group('prefix')}{m.group('q')}{new_spec}{m.group('q')}"
              out=rx.sub(repl,out)
            # Workflow/source-text assertions that execute a moved QA must use qa/<name>.
            for target_name in moved:
              out=out.replace(f'node {target_name}',f'node qa/{target_name}')
            if out!=text:
              p.write_text(out)

          # Retarget references outside qa/. Workflows are modified for validation/reporting,
          # then reset before the Actions-authored commit because GITHUB_TOKEN cannot push them.
          tracked=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          for rel in tracked:
            if rel.startswith('qa/'):
              continue
            p=Path(rel)
            try:
              text=p.read_text()
            except Exception:
              continue
            out=text
            for name in moved:
              out=out.replace(name,f'qa/{name}')
            if out!=text:
              p.write_text(out)

          workflow_files=subprocess.check_output(['git','diff','--name-only','--','.github/workflows'],text=True).splitlines()
          stale_in_qa=[]
          for p in qa_dir.rglob('*'):
            if not p.is_file() or p.suffix not in {'.js','.mjs','.cjs'}:
              continue
            text=p.read_text(errors='ignore')
            for name in moved:
              if f'../{name}' in text or f'node {name}' in text:
                stale_in_qa.append({'file':p.as_posix(),'name':name})

          report={'moved':moved,'count':len(moved),'workflowFiles':workflow_files,'staleQaDirRefs':stale_in_qa}
          (qa_dir/'QA_ROOT_MIGRATION_REPORT.json').write_text(json.dumps(report,indent=2)+'\n')

          gate_lines=[
            "import fs from 'node:fs';",
            "import path from 'node:path';",
            "import assert from 'node:assert/strict';",
            "const root=process.cwd();",
            "const qaName=/^(?:qa[-_].*|.*_QA)\\.(?:m?js)$/i;",
            "const rootQa=fs.readdirSync(root,{withFileTypes:true}).filter(e=>e.isFile()&&qaName.test(e.name)).map(e=>e.name);",
            "assert.deepEqual(rootQa,[],`QA files remain at project root: ${rootQa.join(', ')}`);",
            "const workflowDir=path.join(root,'.github','workflows');",
            "const stale=[];",
            "if(fs.existsSync(workflowDir))for(const name of fs.readdirSync(workflowDir)){",
            "  if(name==='qa-root-layout-migrate.yml'||!/\\.ya?ml$/i.test(name))continue;",
            "  const text=fs.readFileSync(path.join(workflowDir,name),'utf8');",
            "  for(const m of text.matchAll(/(^|[^\\w/])((?:qa[-_][A-Za-z0-9_.-]*|[A-Za-z0-9_.-]*_QA)\\.(?:m?js))/g))stale.push(`${name}: ${m[2]}`);",
            "}",
            "assert.deepEqual(stale,[],`workflow references still target root QA files:\\n${stale.join('\\n')}`);",
            "console.log('QA ROOT LAYOUT QA: PASS',{rootQaFiles:0,workflowStaleRefs:0});",
          ]
          (qa_dir/'QA_ROOT_LAYOUT_QA.mjs').write_text('\n'.join(gate_lines)+'\n')
          print(json.dumps(report,indent=2))
          PY
          node qa/QA_ROOT_LAYOUT_QA.mjs
          test "$(find . -maxdepth 1 -type f \( -name 'qa-*.mjs' -o -name 'qa_*.mjs' -o -name '*_QA.mjs' \) | wc -l)" -eq 0
          find qa -maxdepth 1 -type f -name 'qa-*.mjs' -print0 | xargs -0 -n1 node --check
          node qa/DEV_INTEGRATION_AUDIT.mjs
          npm run build
      - name: Preserve workflow retarget list and reset workflow edits
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows
          git status --short
      - name: Commit QA layout migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'world-drive-qa'
          git config user.email 'world-drive-qa@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          git commit -m 'Structure QA: move root tests under qa directory'
          git push origin HEAD:cleanup/qa-root-layout
