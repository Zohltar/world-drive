name: Source Tree R2 Multiplayer Candidate

on:
  push:
    branches:
      - cleanup/source-tree-r2-multiplayer
    paths:
      - 'src/**'
      - 'qa/**'
      - 'qa-*.mjs'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: R2 multiplayer folder boundary
        run: node qa-source-tree-r2-multiplayer.mjs
      - name: Runtime import/source-tree audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: C6.7 local gear diagnostics
        run: node qa-diagnostics-c6-7.mjs
      - name: C6.8 wire diagnostics
        run: node qa-diagnostics-c6-8.mjs
      - name: C6.11 HD visual diagnostics
        run: node qa-diagnostics-c6-11.mjs
      - name: Multiplayer M3 protocol
        run: node qa/V21_31_MULTIPLAYER_M3_PROTOCOL_QA.mjs
      - name: Multiplayer M3 client
        run: node qa/V21_31_MULTIPLAYER_M3_CLIENT_QA.mjs
      - name: Multiplayer registry
        run: node qa/V21_31_MULTIPLAYER_M3_REGISTRY_QA.mjs
      - name: Multiplayer support
        run: node qa/V21_31_MULTIPLAYER_M3_SUPPORT_QA.mjs
      - name: Multiplayer lighting matrix
        run: node qa/V21_31_MULTIPLAYER_M3_LIGHTING_MATRIX_QA.mjs
      - name: Shared traffic
        run: node qa-traffic-mp1.mjs
      - name: Live traffic
        run: node qa-traffic-mp1-live.mjs
      - name: Multiplayer M4 adapter
        run: node qa/V21_31_MULTIPLAYER_M4_ADAPTER_QA.mjs
      - name: M4.11 reverse E2E
        run: node qa/V21_31_MULTIPLAYER_M411_REVERSE_E2E_QA.mjs
      - name: M4.12 controller runtime
        run: node qa/V21_31_MULTIPLAYER_M412_CONTROLLER_RUNTIME_QA.mjs
      - name: M4.14 authored reverse WebGL
        shell: bash
        run: |
          npx vite --host 127.0.0.1 --port 5187 --strictPort >/tmp/r2-m414-vite.log 2>&1 &
          VITE_PID=$!
          cleanup(){ kill "$VITE_PID" >/dev/null 2>&1 || true; cat /tmp/r2-m414-vite.log || true; }
          trap cleanup EXIT
          READY=0
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:5187/qa/m414-render.html >/dev/null 2>&1; then READY=1; break; fi
            sleep 0.1
          done
          test "$READY" = "1"
          xvfb-run -a ./node_modules/.bin/electron --no-sandbox qa/m414-electron-main.cjs
      - name: M4.15 network to WebGL reverse
        shell: bash
        run: |
          npx vite --host 127.0.0.1 --port 5188 --strictPort >/tmp/r2-m415-vite.log 2>&1 &
          VITE_PID=$!
          WORLD_DRIVE_MP_PORT=8081 node server/multiplayer-server.mjs >/tmp/r2-m415-relay.log 2>&1 &
          RELAY_PID=$!
          cleanup(){
            kill "$VITE_PID" "$RELAY_PID" >/dev/null 2>&1 || true
            echo "--- Vite ---"; cat /tmp/r2-m415-vite.log || true
            echo "--- Relay ---"; cat /tmp/r2-m415-relay.log || true
          }
          trap cleanup EXIT
          READY=0
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:5188/qa/m415-render.html >/dev/null 2>&1 && curl -fsS http://127.0.0.1:8081/ >/dev/null 2>&1; then READY=1; break; fi
            sleep 0.1
          done
          test "$READY" = "1"
          M415_URL=http://127.0.0.1:5188/qa/m415-render.html xvfb-run -a ./node_modules/.bin/electron --no-sandbox qa/m415-electron-main.cjs
      - name: Production build
        run: npm run build
      - name: Production code split
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
