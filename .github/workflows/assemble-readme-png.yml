name: Assemble README PNG

on:
  push:
    branches:
      - main
    paths:
      - '.image-staging/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify PNG
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .image-staging/000.txt \
            .image-staging/001.txt \
            .image-staging/002.txt \
            .image-staging/003.txt \
            .image-staging/004.txt \
            .image-staging/005.txt \
            .image-staging/006.txt \
            | base64 -d > src/assets/screenshots/FOREST_LAKE_README.png

          test "$(xxd -p -l 8 src/assets/screenshots/FOREST_LAKE_README.png)" = "89504e470d0a1a0a"
          echo "e178cb22b127ff4162c5f780a30dce9b3fc1cd07e2fb3236cbeb1250e30cc5ad  src/assets/screenshots/FOREST_LAKE_README.png" | sha256sum -c -
          file src/assets/screenshots/FOREST_LAKE_README.png

          sed -i 's#FOREST_LAKE_README\.webp#FOREST_LAKE_README.png#g' README.md
          rm -f src/assets/screenshots/FOREST_LAKE_README.webp
          rm -rf .image-staging
          rm -f .github/workflows/assemble-readme-png.yml

      - name: Commit final README PNG
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md src/assets/screenshots .image-staging .github/workflows/assemble-readme-png.yml
          git commit -m "Docs: fix README screenshot as PNG"
          git push
