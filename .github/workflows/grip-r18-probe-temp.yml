name: Grip R18 EV 90-degree probe
on:
  push:
    branches: [dev]
    paths:
      - 'qa-grip-ev-90deg-probe-r18.mjs'
      - '.github/workflows/grip-r18-probe-temp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node qa-grip-ev-90deg-probe-r18.mjs
