name: Cleanup C6.9 Remaining Diagnostics Audit

on:
  push:
    branches:
      - audit/diagnostics-c6-9
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: C6.9 remaining-global inventory
        run: node qa-diagnostics-c6-9-audit.mjs
      - name: C6.9 traffic-network diagnostics seam
        run: node qa-diagnostics-c6-9-traffic-network-audit.mjs
      - name: C6.1-C6.8 diagnostics regressions
        run: |
          node qa-diagnostics-c6-1.mjs
          node qa-diagnostics-c6-2.mjs
          node qa-diagnostics-c6-3.mjs
          node qa-diagnostics-c6-4.mjs
          node qa-diagnostics-c6-5.mjs
          node qa-diagnostics-c6-6.mjs
          node qa-diagnostics-c6-7.mjs
          node qa-diagnostics-c6-8.mjs
      - name: Shared multiplayer traffic regressions
        run: |
          node qa-traffic-mp1.mjs
          node qa-traffic-mp1-live.mjs
      - name: Traffic behavior regressions
        run: |
          node qa-traffic-r1.mjs
          node qa-traffic-pool-r1.mjs
          node qa-traffic-preload-p1.mjs
      - name: Runtime import and debt audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
