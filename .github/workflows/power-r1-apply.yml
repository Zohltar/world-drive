name: Apply Power R1 WRX torque model

on:
  push:
    branches:
      - power/v21.31
    paths:
      - 'tools/apply-power-r1.mjs'
      - 'qa-power-wrx-r1.mjs'
      - 'src/physics/powertrain-force.js'
      - '.github/workflows/power-r1-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply Power R1
        run: node tools/apply-power-r1.mjs
      - name: Power R1 WRX torque QA
        run: node qa-power-wrx-r1.mjs
      - name: Existing driving and grip regression gates
        run: |
          node qa-grip-braking-r9.mjs
          node qa-grip-braking-r8.mjs
          node qa-grip-countersteer-r7.mjs
          node qa/DEV_DRIVING_SIM_QA.mjs
          node qa/V21_29_BODY_RELATIVE_TRANSMISSION_QA.mjs
          npm run qa:stress
      - name: Production build
        run: npm run build
      - name: Commit Power R1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vehicle-system.js src/driving-runtime-base.js src/main.js
          git commit -m "Power R1: torque-drive WRX through real 6MT gearing"
          git push
