name: QA Root Layout Driving Diagnostic

on:
  push:
    branches:
      - cleanup/qa-root-layout
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Identify moved driving and traffic QA failures
        shell: bash
        run: |
          set +e
          failed=0
          tests=(
            qa/qa-grip-handbrake-r1.mjs
            qa/qa-grip-steering-curve-r3.mjs
            qa/qa-grip-drift-r4.mjs
            qa/qa-grip-offroad-r5.mjs
            qa/qa-grip-jump-r6.mjs
            qa/qa-grip-countersteer-r7.mjs
            qa/qa-grip-braking-r8.mjs
            qa/qa-grip-braking-r9.mjs
            qa/qa-grip-uphill-r10.mjs
            qa/qa-grip-high-speed-r11.mjs
            qa/qa-grip-fleet-high-speed-r12.mjs
            qa/qa-grip-steering-input-r13.mjs
            qa/qa-wheel-ground-reentry-r14.mjs
            qa/qa-skid-contact-alignment-r15.mjs
            qa/qa-grip-fwd-power-r16.mjs
            qa/qa-grip-ev-jturn-r17.mjs
            qa/qa-grip-ev-maneuver-r18.mjs
            qa/qa-grip-jturn-legacy-r19.mjs
            qa/qa-grip-handbrake-lateral-r20.mjs
            qa/qa-grip-full-runtime-180-probe-r20.mjs
            qa/qa-grip-f1-front-slip-r21.mjs
            qa/qa-grip-f1-steering-r22.mjs
            qa/qa-grip-f1-legacy-r23.mjs
            qa/qa-steering-rack-current.mjs
            qa/qa-traffic-r1.mjs
            qa/qa-traffic-pool-r1.mjs
            qa/qa-traffic-preload-p1.mjs
            qa/qa-traffic-mp1.mjs
            qa/qa-traffic-mp1-live.mjs
          )
          for test in "${tests[@]}"; do
            if node "$test" >/tmp/qa-root-layout-test.log 2>&1; then
              echo "PASS $test"
            else
              echo "FAIL $test"
              cat /tmp/qa-root-layout-test.log
              failed=1
            fi
          done
          exit "$failed"
