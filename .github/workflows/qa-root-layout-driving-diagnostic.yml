name: QA Root Layout Forest Diagnostic

on:
  push:
    branches:
      - cleanup/qa-root-layout
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Identify moved forest and streaming QA failures
        shell: bash
        run: |
          set +e
          failed=0
          tests=(
            qa/qa-forest-active-stress.mjs
            qa/qa-forest-active-runtime.mjs
            qa/qa-forest-p929-frame-budget.mjs
            qa/qa-forest-p935-front-startup.mjs
            qa/qa-forest-p936-rolling-prefetch.mjs
            qa/qa-p937-combined-frame-pacing.mjs
            qa/qa-p938-forest-retention.mjs
            qa/qa-p939-hitch-attribution.mjs
            qa/qa-forest-p940-maintenance.mjs
            qa/qa-p941-frame-runtime-attribution.mjs
            qa/qa-p942-browser-long-frame.mjs
            qa/qa-road-signs-p930-runtime.mjs
          )
          for test in "${tests[@]}"; do
            if node "$test" >/tmp/qa-root-layout-test.log 2>&1; then
              echo "PASS $test"
            else
              echo "FAIL $test"
              cat /tmp/qa-root-layout-test.log
              failed=1
            fi
          done
          exit "$failed"
