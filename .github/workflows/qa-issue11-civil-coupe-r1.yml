name: Issue 11 Civil Coupe Forward Axis QA

on:
  push:
    branches:
      - candidate/issue11-civil-traffic-forward-axis-r1
      - dev
    paths:
      - 'src/traffic/civil-traffic-pool.js'
      - 'src/traffic/civil-traffic-local.js'
      - 'src/traffic/civil-traffic.js'
      - 'assets/traffic/generic_passenger_car_pack_traffic.glb'
      - 'qa/qa-traffic-*.mjs'
      - '.github/workflows/qa-issue11-civil-coupe-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Civil traffic authored-forward and pool QA
        run: node qa/qa-traffic-pool-r1.mjs
      - name: Sparse civil traffic regression
        run: node qa/qa-traffic-r1.mjs
      - name: Civil traffic startup preload regression
        run: node qa/qa-traffic-preload-p1.mjs
      - name: Shared multiplayer civil traffic regression
        run: node qa/qa-traffic-mp1.mjs
      - name: Live shared multiplayer traffic regression
        run: node qa/qa-traffic-mp1-live.mjs
      - name: Runtime import and source-tree audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
