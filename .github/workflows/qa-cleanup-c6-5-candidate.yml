name: Cleanup C6.5 Engine Input Diagnostics Candidate

on:
  push:
    branches:
      - cleanup/diagnostics-c6-5
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize C6.5 canonical engine-input diagnostics
        run: node tools/cleanup-c6-5-engine-input.mjs
      - name: C6.5 engine-input diagnostics QA
        run: node qa-diagnostics-c6-5.mjs
      - name: C6.1-C6.4 diagnostics regressions
        run: |
          node qa-diagnostics-c6-1.mjs
          node qa-diagnostics-c6-2.mjs
          node qa-diagnostics-c6-3.mjs
          node qa-diagnostics-c6-4.mjs
      - name: C2 transmission ownership QA
        run: node qa-transmission-c2.mjs
      - name: DNR and direction transmission regressions
        run: |
          node qa/V21_29_DNR_BRAKE_SELECTOR_QA.mjs
          node qa/V21_29_BODY_RELATIVE_TRANSMISSION_QA.mjs
          node qa/V21_29_TRANSMISSION_DIRECTION_QA.mjs
      - name: Combustion clutch regressions
        run: |
          node qa/V21_29_ALL_COMBUSTION_CLUTCH_QA.mjs
          node qa/V21_29_SEMI_AUTO_CLUTCH_QA.mjs
          node qa/V21_29_RUNTIME_WHEELSPIN_QA.mjs
      - name: Multiplayer exact-gear protocol QA
        run: node qa/V21_31_MULTIPLAYER_M3_PROTOCOL_QA.mjs
      - name: Driving dynamics simulation matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Full V21.31 regression stress
        run: npm run qa:stress
      - name: Runtime import and debt audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
      - name: Diff hygiene
        run: git diff --check
      - name: Commit materialized C6.5 runtime
        shell: bash
        run: |
          if git diff --quiet -- src/transmission-controller.js; then
            echo 'No generated runtime changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/transmission-controller.js
          git commit -m 'Cleanup C6.5: centralize engine-input diagnostics'
          git pull --rebase origin cleanup/diagnostics-c6-5
          git push origin HEAD:cleanup/diagnostics-c6-5
