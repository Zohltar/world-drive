name: R3 Traffic Path Migration Helper

on:
  push:
    branches:
      - cleanup/source-tree-r3-traffic
    paths:
      - '.github/workflows/r3-traffic-path-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move traffic family and retarget exact paths
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f src/civil-traffic.js ]; then
            echo 'Traffic family already moved; no migration required.'
            exit 0
          fi

          mkdir -p src/traffic
          git mv src/civil-traffic.js src/traffic/civil-traffic.js
          git mv src/civil-traffic-local.js src/traffic/civil-traffic-local.js
          git mv src/civil-traffic-network-bridge.js src/traffic/civil-traffic-network-bridge.js
          git mv src/civil-traffic-pool.js src/traffic/civil-traffic-pool.js
          git mv src/civil-traffic-preload.js src/traffic/civil-traffic-preload.js

          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if not count:
                  raise SystemExit(f'Expected path contract not found in {path}: {old!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')
              print(f'{path}: {count} x {old} -> {new}')

          # Production paths affected only by the directory depth change.
          for path in [
              'src/traffic/civil-traffic.js',
              'src/traffic/civil-traffic-network-bridge.js',
              'src/traffic/civil-traffic-preload.js',
          ]:
              replace(path,"from './diagnostics.js'","from '../diagnostics.js'")

          for path in [
              'src/traffic/civil-traffic-local.js',
              'src/traffic/civil-traffic-preload.js',
          ]:
              replace(path,"new URL('./assets/2006_hyundai_sonata.glb',import.meta.url).href","new URL('../assets/2006_hyundai_sonata.glb',import.meta.url).href")

          replace('src/driving-runtime.js',"from './civil-traffic.js'","from './traffic/civil-traffic.js'")
          replace('src/multiplayer.js',"from './civil-traffic-network-bridge.js'","from './traffic/civil-traffic-network-bridge.js'")

          # QA source-path contracts only. Workflow trigger/path updates are done
          # separately through the GitHub connector because Actions tokens cannot
          # modify workflow files.
          contract_files=[
              'qa-diagnostics-c6-10.mjs',
              'qa-diagnostics-c6-12.mjs',
              'qa-diagnostics-c6-9.mjs',
              'qa-diagnostics-c6-final-inventory.mjs',
              'qa-traffic-mp1.mjs',
              'qa-traffic-pool-r1.mjs',
              'qa-traffic-preload-p1.mjs',
              'qa-traffic-r1.mjs',
          ]
          for path in contract_files:
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              updated=text.replace('src/civil-traffic','src/traffic/civil-traffic')
              if updated==text:
                  raise SystemExit(f'Expected traffic path contract not found in {path}')
              p.write_text(updated,encoding='utf-8')
              print(f'{path}: traffic path contracts retargeted')
          PY

          # Verify the move did not accidentally alter the application-relative
          # generic pack URLs or the sibling lazy preload spec.
          grep -F "GENERIC_PASSENGER_PACK_URL='./assets/traffic/generic_passenger_car_pack_traffic.glb'" src/traffic/civil-traffic-pool.js
          grep -F "GENERIC_PASSENGER_PACK_FALLBACK_URL='./assets/traffic/generic_passenger_car_pack.glb'" src/traffic/civil-traffic-pool.js
          grep -F "import('./civil-traffic-preload.js')" src/traffic/civil-traffic-pool.js
          grep -F "new URL('../assets/2006_hyundai_sonata.glb',import.meta.url).href" src/traffic/civil-traffic-local.js
          grep -F "new URL('../assets/2006_hyundai_sonata.glb',import.meta.url).href" src/traffic/civil-traffic-preload.js

          git config user.name 'World Drive QA'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'R3: move civil traffic implementation into src/traffic'
          git push origin HEAD:cleanup/source-tree-r3-traffic
