name: Sync Technical Debt Plan

on:
  push:
    branches:
      - dev
    paths:
      - 'tools/update-tech-debt-c1.mjs'
      - '.github/workflows/update-tech-debt-c1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply persistent plan update
        run: |
          if [ -f tools/update-tech-debt-c1.mjs ]; then
            node tools/update-tech-debt-c1.mjs
          else
            echo "Plan sync already materialized"
          fi
      - name: Commit plan sync
        run: |
          if git diff --quiet; then
            echo "No plan changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Docs: close B3 B7 and C1 cleanup records"
          git push origin HEAD:dev
