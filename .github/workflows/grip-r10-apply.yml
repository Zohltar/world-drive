name: Apply Grip R10 uphill load-transfer fix

on:
  push:
    branches:
      - dev
    paths:
      - 'tools/apply-grip-r10-uphill-load-transfer.mjs'
      - 'qa-grip-uphill-r10.mjs'
      - '.github/workflows/grip-r10-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: "github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'CI Grip R10: fix apply workflow guard'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply Grip R10
        run: node tools/apply-grip-r10-uphill-load-transfer.mjs
      - name: Grip R10 uphill stability QA
        run: node qa-grip-uphill-r10.mjs
      - name: Existing grip regression gates
        run: |
          node qa-grip-braking-r9.mjs
          node qa-grip-braking-r8.mjs
          node qa-grip-countersteer-r7.mjs
          node qa-grip-drift-r4.mjs
          node qa-grip-offroad-r5.mjs
          node qa-grip-jump-r6.mjs
          node qa/V21_27_WRX_CORNER_STABILITY_QA.mjs
          node qa/V21_27_WRX_BRAKE_IN_CORNER_QA.mjs
          node qa/DEV_DRIVING_SIM_QA.mjs
          npm run qa:stress
      - name: Production build
        run: npm run build
      - name: Commit Grip R10
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/per-wheel-shadow-solver.js .github/workflows/qa-dev-integration.yml
          git commit -m "Grip R10: separate grade gravity from tire load transfer"
          git push
