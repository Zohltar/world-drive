name: Block 8 Mixed Temperate Forest R16 QA
on:
  push:
    branches: [candidate/block8-biome-classifier-r1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendered-mixed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESOLVE_SHA256: be36d6209e443038d02e309f0447c6e7f2a62f5fe60c605ffe90d064952f2a60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve accepted runtime and original asset buffers
        run: node qa/qa-block8-rendered-pilot-boundary-r12.mjs
      - name: Deterministic mixture and unchanged homogeneous contracts
        run: |
          mkdir -p "$RUNNER_TEMP/biome-r16"
          node qa/qa-block8-mixed-presentation-r16.mjs "$RUNNER_TEMP/biome-r16/unit-qa.json"
          node qa/qa-block8-rendered-pilot-r12.mjs
          node qa/qa-block8-rendered-manic-r13.mjs
          node qa/qa-block8-rendered-laguna-r14.mjs
          node qa/qa-block8-rendered-yungas-r15.mjs
          node qa/qa-block8-rendered-route-owner-r12.mjs
          node qa/qa-block8-forest-progressive-layer-r4.mjs
      - name: Existing project and build-only native harness
        run: |
          npm ci
          python -m pip install numpy==2.2.6 rasterio==1.4.3 pyshp==2.3.1 shapely==2.1.2 playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual Three prefix, height, seasonal and ownership checks
        run: node qa/qa-block8-mixed-three-r16.mjs "$RUNNER_TEMP/biome-r16/three-qa.json"
      - name: Rebuild the unchanged finite R12 source package
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --connect-timeout 20 --max-time 180 --max-filesize 200000000 https://storage.googleapis.com/teow2016/Ecoregions2017.zip -o "$RUNNER_TEMP/Ecoregions2017.zip"
          echo "$RESOLVE_SHA256  $RUNNER_TEMP/Ecoregions2017.zip" | sha256sum --check --strict
          python tools/biomes/build-resolve-atlas.py --input "$RUNNER_TEMP/Ecoregions2017.zip" --output "$RUNNER_TEMP/atlas-r16" --cell-degrees 0.1 --expected-sha256 "$RESOLVE_SHA256"
          python tools/biomes/build-rendered-pilot-r12.py --source "$RUNNER_TEMP/Ecoregions2017.zip" --atlas "$RUNNER_TEMP/atlas-r16" --output "$RUNNER_TEMP/biome-r16/pilot"
          echo "7432f64a462563351b6c400f35ddda50307f1af109376ac8a76911929a644cf8  $RUNNER_TEMP/biome-r16/pilot/public/local-data/biomes/pilot-r12/directory.json" | sha256sum --check --strict
      - name: Original polygon oracle and full native game mixed summer winter OFF
        run: python qa/qa-block8-rendered-mixed-browser-r16.py --pilot "$RUNNER_TEMP/biome-r16/pilot" --output "$RUNNER_TEMP/biome-r16/native"
      - name: Preserve exact source and measured evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/biome-r16"
          git rev-parse HEAD > "$RUNNER_TEMP/biome-r16/tested-commit.txt"
          git archive --format=tar.gz HEAD tools/biomes src/scenery/biomes src/app/forest-visual-pilot.js src/app/biome-diagnostics.js src/scenery/scenery-renderer-p933.js src/routing/circuits src/forest-streaming-policy.js src/forest-proxy-assets.js qa/qa-block8-mixed-presentation-r16.mjs qa/qa-block8-mixed-three-r16.mjs qa/qa-block8-rendered-mixed-browser-r16.py qa/qa-block8-rendered-pilot-browser-r12.py .github/workflows/qa-block8-rendered-mixed-r16.yml docs/WORLD_DRIVE_BLOCK8_ACTIVE_CANDIDATE.md docs/WORLD_DRIVE_BLOCK8_MIXED_NORD_R16.md > "$RUNNER_TEMP/biome-r16/r16-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biome-r16-mixed-${{ github.sha }}
          path: ${{ runner.temp }}/biome-r16
          if-no-files-found: error
