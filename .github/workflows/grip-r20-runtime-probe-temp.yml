name: Grip R20 full runtime maneuver probe
on:
  push:
    branches: [dev]
    paths:
      - 'qa-grip-full-runtime-180-probe-r20.mjs'
      - '.github/workflows/grip-r20-runtime-probe-temp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node qa-grip-full-runtime-180-probe-r20.mjs
