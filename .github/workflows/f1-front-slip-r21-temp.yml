name: Apply F1 front-slip R21
on:
  push:
    branches: ['audit/f1-front-slip-r21']
    paths:
      - 'qa/apply-f1-front-slip-r21-temp.mjs'
      - 'qa/finalize-f1-front-slip-r21-temp.mjs'
      - '.github/workflows/f1-front-slip-r21-temp.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node qa/apply-f1-front-slip-r21-temp.mjs
      - run: node qa/finalize-f1-front-slip-r21-temp.mjs
      - name: F1 front-slip R21 QA
        run: node qa-grip-f1-front-slip-r21.mjs
      - name: Grip regression slice
        run: |
          node qa-grip-drift-r4.mjs
          node qa-grip-countersteer-r7.mjs
          node qa-grip-high-speed-r11.mjs
          node qa-grip-fleet-high-speed-r12.mjs
          node qa-grip-fwd-power-r16.mjs
          node qa-grip-jturn-legacy-r19.mjs
          node qa-grip-handbrake-lateral-r20.mjs
          node qa-grip-full-runtime-180-probe-r20.mjs
      - name: Full stress and driving matrix
        run: |
          npm run qa:stress
          node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Production build
        run: npm run build
      - name: Commit R21 candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/driving-runtime-base.js qa-grip-f1-front-slip-r21.mjs
          git add -u qa-f1-front-slip-probe-r21.mjs
          git diff --cached --quiet || git commit -m 'Grip R21: prevent F1 front-slip counter-yaw'
          git push
