name: Apply F1 steering R22

on:
  push:
    branches:
      - dev
    paths:
      - 'qa/apply-f1-steering-r22-temp.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply R22
        run: node qa/apply-f1-steering-r22-temp.mjs
      - name: R22 targeted QA
        run: |
          node qa-grip-f1-steering-r22.mjs
          node qa-grip-steering-input-r13.mjs
          node qa-grip-f1-front-slip-r21.mjs
      - name: Driving regression
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Production build
        run: npm run build
      - name: Commit R22 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/vehicle-dynamics-v21.29.js
          git diff --cached --quiet || git commit -m 'Grip R22: soften F1 stick progressively at ultra-high speed'
          git push
