name: Block 8 Ecological Eifel R22 QA
on:
  push:
    branches: [candidate/block8-biome-classifier-r1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ecological-eifel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESOLVE_SHA256: be36d6209e443038d02e309f0447c6e7f2a62f5fe60c605ffe90d064952f2a60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve approved runtime, R4 and source boundary
        run: node qa/qa-block8-rendered-pilot-boundary-r12.mjs
      - name: Install locked project and native browser dependencies
        run: |
          npm ci
          python -m pip install numpy==2.2.6 rasterio==1.4.3 pyshp==2.3.1 shapely==2.1.2 playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: New R22 Eifel presentation plus accepted Nord/R18 regressions
        run: |
          mkdir -p "$RUNNER_TEMP/biome-r22"
          node qa/qa-block8-eifel-nord-r22.mjs "$RUNNER_TEMP/biome-r22/unit-qa.json"
          node qa/qa-block8-understory-r18.mjs
          node qa/qa-block8-understory-controller-r18.mjs
          node qa/qa-block8-natural-forest-r17.mjs
          node qa/qa-block8-mixed-presentation-r16.mjs
          node qa/qa-block8-rendered-pilot-r12.mjs
          node qa/qa-block8-rendered-route-owner-r12.mjs
          node qa/qa-block8-forest-progressive-layer-r4.mjs
      - name: Rebuild unchanged verified R12 geographic package
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --connect-timeout 20 --max-time 180 --max-filesize 200000000 https://storage.googleapis.com/teow2016/Ecoregions2017.zip -o "$RUNNER_TEMP/Ecoregions2017.zip"
          echo "$RESOLVE_SHA256  $RUNNER_TEMP/Ecoregions2017.zip" | sha256sum --check --strict
          python tools/biomes/build-resolve-atlas.py --input "$RUNNER_TEMP/Ecoregions2017.zip" --output "$RUNNER_TEMP/atlas-r22" --cell-degrees 0.1 --expected-sha256 "$RESOLVE_SHA256"
          python tools/biomes/build-rendered-pilot-r12.py --source "$RUNNER_TEMP/Ecoregions2017.zip" --atlas "$RUNNER_TEMP/atlas-r22" --output "$RUNNER_TEMP/biome-r22/pilot"
          echo "7432f64a462563351b6c400f35ddda50307f1af109376ac8a76911929a644cf8  $RUNNER_TEMP/biome-r22/pilot/public/local-data/biomes/pilot-r12/directory.json" | sha256sum --check --strict
      - name: Native full-game R18 versus R22 summer winter and cleanup
        run: python qa/qa-block8-eifel-nord-browser-r22.py --pilot "$RUNNER_TEMP/biome-r22/pilot" --output "$RUNNER_TEMP/biome-r22/native"
      - name: Preserve exact source and actual rendered evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/biome-r22"
          git rev-parse HEAD > "$RUNNER_TEMP/biome-r22/tested-commit.txt"
          git archive --format=tar.gz HEAD docs/WORLD_DRIVE_BLOCK8_ECOLOGICAL_VEGETATION_CONTRACT.md tools/biomes/eifel-temperate-presentation-r22.mjs tools/biomes/eifel-pilot-launcher-r22.mjs tools/biomes/rendered-pilot-r12.mjs qa/qa-block8-eifel-nord-r22.mjs qa/qa-block8-eifel-nord-browser-r22.py .github/workflows/qa-block8-eifel-nord-r22.yml > "$RUNNER_TEMP/biome-r22/r22-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biome-r22-ecological-eifel-${{ github.sha }}
          path: ${{ runner.temp }}/biome-r22
          if-no-files-found: error
