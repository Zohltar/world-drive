name: Grip R16 FWD direction probe
on:
  push:
    branches: [dev]
    paths:
      - 'qa-grip-fwd-power-r16.mjs'
      - '.github/workflows/grip-r16-probe-temp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node qa-grip-fwd-power-r16.mjs
