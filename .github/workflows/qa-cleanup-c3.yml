name: Cleanup C3 Road Geometry QA

on:
  push:
    branches:
      - dev
    paths:
      - 'src/road-geometry.js'
      - 'src/road-geometry-base.js'
      - 'qa-road-geometry-c3.mjs'
      - 'qa/V21_25_ROAD_GEOMETRY_REFACTOR_QA.mjs'
      - 'qa/V21_31_ROAD_SMOOTHING_QA.mjs'
      - 'qa/V21_31_SUPERELEVATION_QA.mjs'
      - 'qa/V21_31_SUPERELEVATION_ENVELOPE_QA.mjs'
      - 'qa/V21_31_LEGACY_TERRAIN_AUTHORITY_QA.mjs'
      - 'qa-road-banking-r1.mjs'
      - 'qa-terrain-r1-legacy-ownership.mjs'
      - 'qa-terrain-r2-road-imagery.mjs'
      - '.github/workflows/qa-cleanup-c3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: C3 road geometry ownership
        run: node qa-road-geometry-c3.mjs
      - name: Historical V21.25 road behavior QA
        run: node qa/V21_25_ROAD_GEOMETRY_REFACTOR_QA.mjs
      - name: Active V21.31 road regressions
        run: |
          node qa/V21_31_ROAD_SMOOTHING_QA.mjs
          node qa/V21_31_SUPERELEVATION_QA.mjs
          node qa/V21_31_SUPERELEVATION_ENVELOPE_QA.mjs
          node qa/V21_31_LEGACY_TERRAIN_AUTHORITY_QA.mjs
          node qa-road-banking-r1.mjs
          node qa-terrain-r1-legacy-ownership.mjs
          node qa-terrain-r2-road-imagery.mjs
      - name: Driving dynamics simulation matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Production build
        run: npm run build
