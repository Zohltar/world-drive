name: Cleanup C3 Road Geometry Audit

on:
  push:
    branches:
      - audit/road-geometry-c3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: C3 ownership scan
        run: node qa-road-geometry-c3-audit.mjs
      - name: Historical V21.25 road-refactor truth check
        shell: bash
        run: |
          if node qa/V21_25_ROAD_GEOMETRY_REFACTOR_QA.mjs; then
            echo "Unexpected: historical V21.25 source-location QA still passes before C3"
            exit 1
          fi
          echo "Expected stale QA failure confirmed on untouched pre-C3 layering"
      - name: Active V21.31 road regressions
        run: |
          node qa/V21_31_ROAD_SMOOTHING_QA.mjs
          node qa/V21_31_SUPERELEVATION_QA.mjs
          node qa/V21_31_SUPERELEVATION_ENVELOPE_QA.mjs
          node qa/V21_31_LEGACY_TERRAIN_AUTHORITY_QA.mjs
          node qa-road-banking-r1.mjs
          node qa-terrain-r1-legacy-ownership.mjs
          node qa-terrain-r2-road-imagery.mjs
      - name: Driving matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Production build
        run: npm run build
