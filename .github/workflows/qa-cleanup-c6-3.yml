name: Cleanup C6.3 Wheelspin Diagnostics QA

on:
  push:
    branches:
      - dev
    paths:
      - 'src/diagnostics.js'
      - 'src/driving-runtime.js'
      - 'src/physics/wheelspin-state.js'
      - 'qa/qa-diagnostics-c6-3.mjs'
      - 'qa/qa-wheelspin-state-b6.mjs'
      - 'qa/V21_29_RUNTIME_WHEELSPIN_QA.mjs'
      - 'qa/V21_29_CIVIC_CLUTCH_WHEELSPIN_QA.mjs'
      - '.github/workflows/qa-cleanup-c6-3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: C6.3 wheelspin diagnostics QA
        run: node qa/qa-diagnostics-c6-3.mjs
      - name: B6 wheelspin ownership QA
        run: node qa/qa-wheelspin-state-b6.mjs
      - name: V21.29 runtime wheelspin QA
        run: node qa/V21_29_RUNTIME_WHEELSPIN_QA.mjs
      - name: Civic clutch wheelspin QA
        run: node qa/V21_29_CIVIC_CLUTCH_WHEELSPIN_QA.mjs
      - name: Driving dynamics simulation matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Runtime import/debt audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
