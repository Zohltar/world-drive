name: Ops Laguna Seca OSM Audit

on:
  push:
    branches:
      - ops/laguna-seca-osm-audit
    paths:
      - .github/workflows/ops-laguna-seca-osm-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/laguna-seca-osm-audit

      - name: Fetch Laguna Seca raceway geometry
        shell: bash
        run: |
          set -euo pipefail
          QUERY='[out:json][timeout:60];(way["highway"="raceway"](around:6000,36.584282,-121.753385);relation["highway"="raceway"](around:6000,36.584282,-121.753385););out geom;'
          for endpoint in \
            'https://overpass-api.de/api/interpreter' \
            'https://overpass.kumi.systems/api/interpreter'; do
            echo "Trying $endpoint"
            if curl --fail --silent --show-error --max-time 90 --retry 2 \
              --data-urlencode "data=${QUERY}" "$endpoint" -o /tmp/laguna-osm.json; then
              test -s /tmp/laguna-osm.json && break
            fi
          done
          test -s /tmp/laguna-osm.json

      - name: Summarize and stitch raceway ways
        shell: python
        run: |
          import json, math
          from pathlib import Path

          raw=json.loads(Path('/tmp/laguna-osm.json').read_text())
          R=6371000.0
          def dist(a,b):
              la1,lo1=map(math.radians,a); la2,lo2=map(math.radians,b)
              dlat=la2-la1; dlon=lo2-lo1
              h=math.sin(dlat/2)**2+math.cos(la1)*math.cos(la2)*math.sin(dlon/2)**2
              return 2*R*math.asin(min(1,math.sqrt(h)))
          def length(points):
              return sum(dist(a,b) for a,b in zip(points,points[1:]))

          items=[]
          for el in raw.get('elements',[]):
              geom=el.get('geometry') or []
              points=[[float(p['lat']),float(p['lon'])] for p in geom if 'lat' in p and 'lon' in p]
              if len(points)<2: continue
              tags=el.get('tags') or {}
              items.append({
                  'type':el.get('type'), 'id':el.get('id'),
                  'name':tags.get('name'), 'ref':tags.get('ref'),
                  'highway':tags.get('highway'), 'raceway':tags.get('raceway'),
                  'service':tags.get('service'), 'access':tags.get('access'),
                  'oneway':tags.get('oneway'), 'surface':tags.get('surface'),
                  'points':points,
                  'pointCount':len(points),
                  'lengthM':round(length(points),2),
                  'endpointGapM':round(dist(points[0],points[-1]),2),
                  'closed':dist(points[0],points[-1])<5,
              })
          items.sort(key=lambda x:x['lengthM'],reverse=True)
          Path('ops').mkdir(exist_ok=True)
          Path('ops/laguna-seca-osm-audit.json').write_text(json.dumps({
              'queryCenter':{'lat':36.584282,'lon':-121.753385},
              'elementCount':len(raw.get('elements',[])),
              'geometryCount':len(items),
              'items':items,
          },indent=2),encoding='utf-8')

          main=[x for x in items if x.get('name')!='Pit Lane']
          if len(main)!=8:
              raise SystemExit(f'Expected 8 non-pit main-circuit ways, found {len(main)}')

          # OSM marks the circuit ways one-way. Follow those authored directions when
          # possible, allowing reversal only as a diagnostic fallback if endpoint
          # ordering differs in the Overpass response.
          remaining={x['id']:x for x in main}
          seed=max(main,key=lambda x:x['lengthM'])
          ordered=[]
          current=seed
          current_points=current['points']
          ordered.append({'id':current['id'],'name':current['name'],'reversed':False})
          loop=list(current_points)
          del remaining[current['id']]
          while remaining:
              end=loop[-1]
              candidates=[]
              for candidate in remaining.values():
                  forward=dist(end,candidate['points'][0])
                  reverse=dist(end,candidate['points'][-1])
                  candidates.append((forward,candidate['id'],False,candidate))
                  candidates.append((reverse,candidate['id'],True,candidate))
              gap,_,rev,next_way=min(candidates,key=lambda t:t[0])
              if gap>5:
                  raise SystemExit(f'Cannot stitch circuit: nearest endpoint gap {gap:.2f} m')
              pts=list(reversed(next_way['points'])) if rev else next_way['points']
              if dist(loop[-1],pts[0])<0.5:
                  pts=pts[1:]
              loop.extend(pts)
              ordered.append({'id':next_way['id'],'name':next_way['name'],'reversed':rev,'joinGapM':round(gap,3)})
              del remaining[next_way['id']]

          closure=dist(loop[-1],loop[0])
          if closure>5:
              raise SystemExit(f'Circuit does not close: {closure:.2f} m')
          if dist(loop[-1],loop[0])>0.05:
              loop.append(loop[0])
          elif loop[-1]!=loop[0]:
              loop[-1]=loop[0]

          total=length(loop)
          max_segment=max(dist(a,b) for a,b in zip(loop,loop[1:]))
          if not 3550 <= total <= 3650:
              raise SystemExit(f'Unexpected main-loop length: {total:.2f} m')
          if max_segment>100:
              raise SystemExit(f'Unexpected main-loop segment jump: {max_segment:.2f} m')

          authored={
              'name':'WeatherTech Raceway Laguna Seca',
              'layout':'Grand Prix',
              'source':'OpenStreetMap highway=raceway geometry captured 2026-09-13',
              'sourceWayIds':[x['id'] for x in ordered],
              'orderedWays':ordered,
              'pointCount':len(loop),
              'lengthM':round(total,2),
              'closureGapBeforeSealM':round(closure,3),
              'maxSegmentM':round(max_segment,2),
              'coordinates':[[round(p[1],7),round(p[0],7)] for p in loop],
          }
          Path('ops/laguna-seca-track-loop.json').write_text(json.dumps(authored,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in authored.items() if k!='coordinates'},indent=2))

      - name: Commit audit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/laguna-seca-osm-audit.json ops/laguna-seca-track-loop.json
          git commit -m "Ops: stitch Laguna Seca main circuit geometry"
          git push origin HEAD:ops/laguna-seca-osm-audit
