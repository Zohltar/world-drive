name: Issue 4 Road Shadow QA

on:
  push:
    branches:
      - dev
      - candidate/issue4-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Issue 4 road-volume shadow QA
        run: node qa/qa-issue4-road-volume-shadow.mjs
      - name: Current local-world ownership QA
        run: node qa/qa-local-world-current-a8.mjs
      - name: P9.23 prepared refresh QA
        run: node qa/qa-streaming-p923-prepared-refresh.mjs
      - name: P9.37 combined frame-pacing QA
        run: node qa/qa-p937-combined-frame-pacing.mjs
      - name: P9.38 forest retention QA
        run: node qa/qa-p938-forest-retention.mjs
      - name: C3 road geometry ownership QA
        run: node qa/qa-road-geometry-c3.mjs
      - name: R6 road geometry source-tree QA
        run: node qa/qa-source-tree-r6-road-geometry.mjs
      - name: R8 streaming baseline aggregate
        run: node qa/qa-r8-streaming-baseline.mjs
      - name: Runtime import and source-tree audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
