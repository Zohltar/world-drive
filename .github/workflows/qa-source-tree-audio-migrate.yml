name: Source Tree Audio Migrate

on:
  push:
    branches:
      - cleanup/source-tree-audio
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Move audio modules and retarget paths
        run: |
          set -euo pipefail
          test -f src/audio.js
          test -f src/audio-base.js
          mkdir -p src/audio
          git mv src/audio.js src/audio/audio.js
          git mv src/audio-base.js src/audio/audio-base.js
          python - <<'PY'
          from pathlib import Path
          replacements={
            Path('src/main.js'):[("from './audio.js'","from './audio/audio.js'")],
            Path('qa/V21_29_SKID_AUDIO_LINK_QA.mjs'):[("../src/audio.js","../src/audio/audio.js")],
            Path('qa/V21_29_SKID_AUDIO_CURVE_QA.mjs'):[("../src/audio.js","../src/audio/audio.js")],
          }
          for p,pairs in replacements.items():
            s=p.read_text()
            for old,new in pairs:
              if old not in s:
                raise SystemExit(f'missing expected token {old!r} in {p}')
              s=s.replace(old,new)
            p.write_text(s)
          PY
          grep -F "new Audio('./assets/audio/tire-squeal.mp3')" src/audio/audio.js
          grep -F "const TIRE_SAMPLE_URL='./assets/audio/tire-squeal.mp3'" src/audio/audio-base.js
          grep -F "const BRAKE_SAMPLE_URL='./assets/audio/brake-squeal.mp3'" src/audio/audio-base.js
          test ! -e src/audio.js
          test ! -e src/audio-base.js
      - name: Skid audio linkage QA
        run: node qa/V21_29_SKID_AUDIO_LINK_QA.mjs
      - name: Skid audio curve QA
        run: node qa/V21_29_SKID_AUDIO_CURVE_QA.mjs
      - name: Runtime import/source-tree audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
      - name: Commit migration
        run: |
          git config user.name 'world-drive-qa'
          git config user.email 'world-drive-qa@users.noreply.github.com'
          git add src qa
          git commit -m 'Structure: move audio modules under src/audio' || exit 0
          git push origin HEAD:cleanup/source-tree-audio
