name: Stress V21.31

on:
  push:
    branches:
      - stress/v21.31
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Stress QA
        run: npm run qa:stress
      - name: Live route preset stress
        continue-on-error: true
        run: node qa/STRESS_ROUTE_PRESETS_LIVE.mjs
      - name: Runtime dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build
