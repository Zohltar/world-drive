name: Stress V21.31

on:
  push:
    branches:
      - stress/v21.31
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply lazy GLB optimization
        run: node tools/apply-v21-31-lazy-glb.mjs
      - name: Apply passenger module code split
        run: node tools/apply-v21-31-code-split.mjs
      - name: Install
        run: npm ci
      - name: Stress QA
        run: npm run qa:stress
      - name: Live route preset stress
        continue-on-error: true
        run: node qa/STRESS_ROUTE_PRESETS_LIVE.mjs
      - name: Runtime dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
      - name: Persist validated startup optimizations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "Stress V21.31: code-split passenger GLB systems"
            git push
          fi
