name: Apply Grip R3 steering curve

on:
  push:
    branches:
      - grip/v21.31
    paths:
      - '.github/workflows/grip-r3-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate Grip R3
        shell: bash
        run: |
          set -euo pipefail
          python qa/grip-r3-apply.py
          node qa-grip-steering-curve-r3.mjs
          node qa-grip-handbrake-r1.mjs
          node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Commit Grip R3
        shell: bash
        run: |
          set -euo pipefail
          rm -f qa/grip-r3-apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vehicle-dynamics-v21.29.js qa-grip-steering-curve-r3.mjs qa/grip-r3-apply.py
          git commit -m "Grip R3: replace speed steering caps with progressive input curve"
          git push
