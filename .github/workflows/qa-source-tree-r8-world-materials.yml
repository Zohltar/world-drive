name: R8 World Materials Structure QA

on:
  push:
    branches:
      - dev
      - candidate/r8-world-materials-r1
    paths:
      - 'src/main.js'
      - 'src/world-materials.js'
      - 'src/terrain/world-materials.js'
      - 'qa/qa-source-tree-r8-world-materials.mjs'
      - 'qa/qa-main-c5-materials.mjs'
      - 'qa/V21_22_3_HITCH_FREE_QA.mjs'
      - 'qa/qa-r8-current-ownership.mjs'
      - 'qa/DEV_INTEGRATION_AUDIT.mjs'
      - '.github/workflows/qa-source-tree-r8-world-materials.yml'
      - '.github/workflows/qa-cleanup-c5-materials.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: R8 world-materials source-tree boundary
        run: node qa/qa-source-tree-r8-world-materials.mjs
      - name: C5.1 world-materials behavior contract
        run: node qa/qa-main-c5-materials.mjs
      - name: V21.22.3 visual ownership contract
        run: node qa/V21_22_3_HITCH_FREE_QA.mjs
      - name: R8 current ownership baseline
        run: node qa/qa-r8-current-ownership.mjs
      - name: Runtime import and source-tree audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Terrain visual ownership QA
        run: |
          node qa/qa-terrain-r1-legacy-ownership.mjs
          node qa/qa-terrain-r2-road-imagery.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
