name: Ops Issue 13 Canonical Checkpoint

on:
  push:
    branches:
      - "ops/docs-issue13-checkpoint-20260912"

permissions:
  contents: write
  actions: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact accepted dev runtime
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Verify accepted runtime head
        run: test "$(git rev-parse HEAD)" = "814035fd8dc88ef44191a45b8ec4a8d1d33e106b"

      - name: Update canonical correction plan
        run: |
          git show "origin/ops/docs-issue13-checkpoint-20260912:ops/update_plan_issue13.py" > /tmp/update_plan_issue13.py
          python /tmp/update_plan_issue13.py

      - name: Commit canonical checkpoint to dev
        run: |
          test "$(git status --porcelain | wc -l)" -eq 1
          git status --porcelain | grep -F "docs/WORLD_DRIVE_EVOLUTION_AND_CORRECTION_PLAN.md"
          git config user.name "Zohltar"
          git config user.email "mathieu.plourde@gmail.com"
          git add docs/WORLD_DRIVE_EVOLUTION_AND_CORRECTION_PLAN.md
          git diff --cached --quiet && { echo "No canonical plan change produced"; exit 1; }
          git commit -m "Docs: certify issues 10 and 13 driving support corrections"
          git push origin HEAD:dev
          echo "DOCS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch exact-head Dev Integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/qa-dev-integration.yml/dispatches" \
            -d '{"ref":"dev"}'
          echo "Canonical docs checkpoint: ${DOCS_SHA}"
