name: R8 Terrain Streaming Baseline QA

on:
  push:
    branches:
      - dev
      - candidate/r8-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: R8 current ownership baseline
        run: node qa/qa-r8-current-ownership.mjs
      - name: Runtime import and source-tree audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Current local-world ownership QA
        run: node qa/qa-local-world-current-a8.mjs
      - name: P9.17 load smoothing QA
        run: node qa/qa-streaming-p917-load-smoothing.mjs
      - name: P9.18 loading QA
        run: node qa/qa-streaming-p918-loading.mjs
      - name: P9.19 elevation QA
        run: node qa/qa-streaming-p919-elevation.mjs
      - name: P9.20 world phases QA
        run: node qa/qa-streaming-p920-world-phases.mjs
      - name: P9.21 terrain reuse QA
        run: node qa/qa-streaming-p921-terrain-reuse.mjs
      - name: P9.22 road transition QA
        run: node qa/qa-streaming-p922-road-transition.mjs
      - name: Forest route cache reset QA
        run: node qa/qa-forest-route-cache-reset.mjs
      - name: P9.23 prepared refresh QA
        run: node qa/qa-streaming-p923-prepared-refresh.mjs
      - name: P9.23 scheduler QA
        run: node qa/qa-streaming-p923-scheduler.mjs
      - name: P9.24 frame budget QA
        run: node qa/qa-streaming-p924-frame-budget.mjs
      - name: P9.25 scenery and prep QA
        run: node qa/qa-streaming-p925-scenery-and-prep.mjs
      - name: P9.26 horizon QA
        run: node qa/qa-streaming-p926-horizon.mjs
      - name: P9.27 road transition QA
        run: node qa/qa-streaming-p927-road-transition.mjs
      - name: Terrain R1 visual ownership QA
        run: node qa/qa-terrain-r1-legacy-ownership.mjs
      - name: Terrain R2 road imagery alignment QA
        run: node qa/qa-terrain-r2-road-imagery.mjs
      - name: P9.37 combined frame-pacing QA
        run: node qa/qa-p937-combined-frame-pacing.mjs
      - name: P9.38 prepared forest-retention QA
        run: node qa/qa-p938-forest-retention.mjs
      - name: P9.39 hitch attribution QA
        run: node qa/qa-p939-hitch-attribution.mjs
      - name: P9.40 forest queue maintenance QA
        run: node qa/qa-forest-p940-maintenance.mjs
      - name: P9.41 frame-runtime attribution QA
        run: node qa/qa-p941-frame-runtime-attribution.mjs
      - name: P9.42 browser long-frame attribution QA
        run: node qa/qa-p942-browser-long-frame.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
