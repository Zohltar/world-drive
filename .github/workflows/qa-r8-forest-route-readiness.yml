name: R8 Forest Route Readiness QA

on:
  push:
    branches:
      - dev
      - candidate/r8-forest-route-readiness-r1
    paths:
      - 'src/routing/route-lifecycle.js'
      - 'src/scenery/scenery-renderer-p933.js'
      - 'src/forest-chunk-streamer.js'
      - 'src/forest-chunk-streamer-core.js'
      - 'src/forest-streaming-policy.js'
      - 'qa/qa-r8-forest-route-readiness.mjs'
      - 'qa/qa-forest-p935-front-startup.mjs'
      - 'qa/qa-forest-p936-rolling-prefetch.mjs'
      - 'qa/qa-p938-forest-retention.mjs'
      - 'qa/qa-route-start-final-placement-r8.mjs'
      - 'qa/DEV_INTEGRATION_AUDIT.mjs'
      - '.github/workflows/qa-r8-forest-route-readiness.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: In-game route forest readiness
        run: node qa/qa-r8-forest-route-readiness.mjs
      - name: Route-start final placement preservation
        run: node qa/qa-route-start-final-placement-r8.mjs
      - name: Existing finite route placement contract
        run: node qa/V21_31_ROUTE_PLACEMENT_FINITE_QA.mjs
      - name: Route lifecycle boundary
        run: node qa/V21_26_ROUTE_LIFECYCLE_REFACTOR_QA.mjs
      - name: Forest startup/front-load
        run: node qa/qa-forest-p935-front-startup.mjs
      - name: Forest rolling prefetch
        run: node qa/qa-forest-p936-rolling-prefetch.mjs
      - name: Prepared forest retention
        run: node qa/qa-p938-forest-retention.mjs
      - name: R8 terrain and streaming baseline
        run: node qa/qa-r8-streaming-baseline.mjs
      - name: Runtime import and source-tree audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
