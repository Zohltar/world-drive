name: Update Tech Debt C6.1 Close

on:
  push:
    branches:
      - docs/c6-1-close
    paths:
      - tools/update-tech-debt-c6-1-close.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/update-tech-debt-c6-1-close.mjs
      - shell: bash
        run: |
          if git diff --quiet -- docs/WORLD_DRIVE_TECH_DEBT_PLAN.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/WORLD_DRIVE_TECH_DEBT_PLAN.md
          git commit -m 'Docs: close C6.1 diagnostics consolidation'
          git pull --rebase origin docs/c6-1-close
          git push origin HEAD:docs/c6-1-close
