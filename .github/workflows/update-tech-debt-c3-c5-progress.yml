name: Update Tech Debt C3-C5 Progress

on:
  push:
    branches:
      - docs/c3-c5-progress
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update plan
        run: node tools/update-tech-debt-c3-c5-progress.mjs
      - name: Commit plan
        run: |
          if git diff --quiet -- docs/WORLD_DRIVE_TECH_DEBT_PLAN.md; then
            echo "No plan changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/WORLD_DRIVE_TECH_DEBT_PLAN.md
          git commit -m "Docs: record C3-C5 cleanup progress"
          git push origin HEAD:docs/c3-c5-progress
