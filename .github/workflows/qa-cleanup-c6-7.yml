name: Cleanup C6.7 Multiplayer Local Gear Diagnostics QA

on:
  push:
    branches:
      - dev
    paths:
      - 'src/multiplayer.js'
      - 'src/diagnostics.js'
      - 'src/transmission-network-state.js'
      - 'qa/qa-diagnostics-c6-1.mjs'
      - 'qa/qa-diagnostics-c6-2.mjs'
      - 'qa/qa-diagnostics-c6-3.mjs'
      - 'qa/qa-diagnostics-c6-4.mjs'
      - 'qa/qa-diagnostics-c6-5.mjs'
      - 'qa/qa-diagnostics-c6-6.mjs'
      - 'qa/qa-diagnostics-c6-7.mjs'
      - 'qa/qa-transmission-c2.mjs'
      - 'qa/V21_29_DNR_BRAKE_SELECTOR_QA.mjs'
      - 'qa/V21_29_BODY_RELATIVE_TRANSMISSION_QA.mjs'
      - 'qa/V21_29_TRANSMISSION_DIRECTION_QA.mjs'
      - 'qa/V21_31_MULTIPLAYER_M3_PROTOCOL_QA.mjs'
      - 'qa/qa-traffic-mp1.mjs'
      - 'qa/qa-traffic-mp1-live.mjs'
      - '.github/workflows/qa-cleanup-c6-7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: C6.1-C6.7 diagnostics QA
        run: |
          node qa/qa-diagnostics-c6-1.mjs
          node qa/qa-diagnostics-c6-2.mjs
          node qa/qa-diagnostics-c6-3.mjs
          node qa/qa-diagnostics-c6-4.mjs
          node qa/qa-diagnostics-c6-5.mjs
          node qa/qa-diagnostics-c6-6.mjs
          node qa/qa-diagnostics-c6-7.mjs
      - name: C2 transmission ownership QA
        run: node qa/qa-transmission-c2.mjs
      - name: DNR and direction regressions
        run: |
          node qa/V21_29_DNR_BRAKE_SELECTOR_QA.mjs
          node qa/V21_29_BODY_RELATIVE_TRANSMISSION_QA.mjs
          node qa/V21_29_TRANSMISSION_DIRECTION_QA.mjs
      - name: Multiplayer exact-gear protocol QA
        run: node qa/V21_31_MULTIPLAYER_M3_PROTOCOL_QA.mjs
      - name: Shared multiplayer traffic regressions
        run: |
          node qa/qa-traffic-mp1.mjs
          node qa/qa-traffic-mp1-live.mjs
      - name: Driving dynamics simulation matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Full V21.31 regression stress
        run: npm run qa:stress
      - name: Runtime import and debt audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
