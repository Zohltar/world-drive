name: Temporary Issue 4 Surface Probe R5 Patch

on:
  push:
    branches:
      - candidate/issue4-surface-probe-r5

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'Chore: seed issue 4 surface probe r5' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch read-only issue 4 surface diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path=Path('src/main.js')
          source=path.read_text()
          anchor='// V21.27.2 diagnostics only. Safe to inspect from DevTools; values do not\n'
          if source.count(anchor)!=1:
              raise SystemExit(f'expected one diagnostics anchor, found {source.count(anchor)}')
          insert=base64.b64decode('').decode()
          path.write_text(source.replace(anchor,insert+anchor))
          PY
          git diff --check
      - name: Commit focused diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git commit -m "Diagnostics: compare issue 4 physical and rendered surfaces"
          git push origin HEAD:candidate/issue4-surface-probe-r5
