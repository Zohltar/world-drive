name: R6 Road Furniture Candidate QA

on:
  push:
    branches:
      - candidate/r6-road-furniture
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: R6 road-furniture source-tree boundary
        run: node qa/qa-source-tree-r6-road-furniture.mjs
      - name: Runtime import and debt audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: C6.4 road-sign diagnostics QA
        run: node qa/qa-diagnostics-c6-4.mjs
      - name: C6 final global boundary QA
        run: node qa/qa-diagnostics-c6-final-inventory.mjs
      - name: P9.30 road-sign runtime QA
        run: node qa/qa-road-signs-p930-runtime.mjs
      - name: P9.37 combined frame-pacing QA
        run: node qa/qa-p937-combined-frame-pacing.mjs
      - name: C5.4 geographic sign orchestration QA
        run: node qa/qa-main-c5-geographic-signs.mjs
      - name: V21.25 minimap sign readout QA
        run: node qa/V21_25_MINIMAP_SIGN_READOUT_QA.mjs
      - name: Full V21.31 regression stress
        run: npm run qa:stress
      - name: Driving dynamics simulation matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
