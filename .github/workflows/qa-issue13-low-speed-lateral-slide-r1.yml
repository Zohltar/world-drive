name: Issue 13 Low-Speed Lateral Slide QA

on:
  push:
    branches:
      - candidate/issue-13-low-speed-lateral-slide-r1
    paths:
      - 'qa/qa-issue13-low-speed-lateral-slide-repro-r1.mjs'
      - 'qa/qa-issue13-low-speed-lateral-runtime-r2.mjs'
      - 'qa/qa-issue10-steep-slope-contact-r2.mjs'
      - 'qa/DEV_INTEGRATION_AUDIT.mjs'
      - 'src/physics/**'
      - 'src/vehicles/**'
      - '.github/workflows/qa-issue13-low-speed-lateral-slide-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Issue 13 support/grip stress probe
        run: node qa/qa-issue13-low-speed-lateral-slide-repro-r1.mjs
      - name: Issue 13 trajectory recovery regression
        run: node qa/qa-issue13-low-speed-lateral-runtime-r2.mjs
      - name: Issue 10 steep-slope contact regression
        run: node qa/qa-issue10-steep-slope-contact-r2.mjs
      - name: Airborne and crest regression
        run: node qa/qa-grip-jump-r6.mjs
      - name: Road reentry vertical support regression
        run: node qa/qa-wheel-ground-reentry-r14.mjs
      - name: Wheel-ground ownership regression
        run: node qa/qa-source-tree-r5b-wheel-ground-support.mjs
      - name: Driving dynamics simulation matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Permanent Dev Integration audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
