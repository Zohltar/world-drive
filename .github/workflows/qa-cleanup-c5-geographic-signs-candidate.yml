name: Cleanup C5.4 Geographic Sign Candidate

on:
  push:
    branches:
      - cleanup/main-c5-geographic-signs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Materialize C5.4 extraction
        shell: bash
        run: |
          if grep -q 'function nearestRouteCumToFeature(points)' src/main.js; then
            node tools/cleanup-c5-geographic-signs.mjs
          else
            echo 'C5.4 already materialized'
          fi
      - name: C5.4 geographic sign ownership and behavior QA
        run: node qa-main-c5-geographic-signs.mjs
      - name: Road-sign incremental runtime QA
        run: node qa-road-signs-p930-runtime.mjs
      - name: Minimap refactor QA
        run: node qa/V21_25_MINIMAP_REFACTOR_QA.mjs
      - name: Minimap sign readout QA
        run: node qa/V21_25_MINIMAP_SIGN_READOUT_QA.mjs
      - name: Runtime import and debt audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Driving dynamics simulation matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Full V21.31 regression stress
        run: npm run qa:stress
      - name: Production build
        run: npm run build
      - name: Diff hygiene
        run: git diff --check
      - name: Commit materialized C5.4 candidate
        shell: bash
        run: |
          if git diff --quiet -- src/main.js; then
            echo 'No materialized main.js change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js
          git commit -m 'Cleanup C5.4: move geographic sign orchestration out of main'
          git push origin HEAD:cleanup/main-c5-geographic-signs
