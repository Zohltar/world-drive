name: Update Tech Debt C6.8 QA Discovery

on:
  push:
    branches:
      - docs/c6-8-qa-discovery
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/update-tech-debt-c6-8-qa-discovery.mjs
      - name: Commit plan update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/WORLD_DRIVE_TECH_DEBT_PLAN.md
          git diff --cached --quiet && exit 1
          git commit -m 'Docs: record C6.8 wire QA discovery'
          git push
