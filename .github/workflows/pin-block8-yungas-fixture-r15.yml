name: Block 8 preserve reviewed Yungas R15 fixture objects
on:
  push:
    branches: [candidate/block8-biome-classifier-r1]
    paths: [.github/workflows/pin-block8-yungas-fixture-r15.yml]
  workflow_dispatch:
jobs:
  preserve-reviewed-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Preserve exactly reviewed original bytes as Git blobs; never move any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, pathlib, subprocess, zipfile
          repo='Zohltar/world-drive'
          raw=subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/10574735816/zip'])
          assert hashlib.sha256(raw).hexdigest()=='e77084fa129279eeb697d07577f32b97843f19a07088f1dc64d54869204389eb'
          z=zipfile.ZipFile(io.BytesIO(raw))
          assert z.read('tested-commit.txt').decode().strip()=='b9854257a28f4e3da1a5bf1e34957484fbd1dd7d'
          payloads={n:z.read('route/'+n) for n in ['response.json.gz','receipt.json']}
          import gzip
          assert hashlib.sha256(gzip.decompress(payloads['response.json.gz'])).hexdigest()=='511da11b27aa74d91237f45f13c84170a57fb0653107a7d7ffc6374e2c871ddb'
          assert hashlib.sha256(payloads['receipt.json']).hexdigest()=='bb1863c7a1bb245bc4cdf43ff8826e3b872796c8faaa1730bb722e70b229debd'
          objects={}
          for name,data in payloads.items():
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              request=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode()
              result=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/blobs','--input','-'],input=request))
              assert result['sha']==expected
              objects['qa/fixtures/biomes/yungas-r15/'+name]={'sha':expected,'bytes':len(data)}
          pathlib.Path('reviewed-objects.json').write_text(json.dumps(objects,indent=2)+'\n')
          print(json.dumps(objects,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-yungas-r15-git-objects
          path: reviewed-objects.json
          if-no-files-found: error
