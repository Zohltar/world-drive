name: Apply Drift Stress R1b surface physics

on:
  push:
    branches:
      - drift-stress/v21.31
    paths:
      - 'tools/fix-drift-patcher-r1.mjs'
      - '.github/workflows/drift-stress-r1b-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Fix patch ordering
        run: node tools/fix-drift-patcher-r1.mjs
      - name: Apply drift surface transition cleanup
        run: node tools/apply-drift-stress-r1.mjs
      - name: Drift surface stress matrix
        run: node qa-drift-surface-stress-r1.mjs
      - name: Existing grip power braking regression gates
        run: |
          node qa-grip-countersteer-r7.mjs
          node qa-grip-braking-r8.mjs
          node qa-grip-braking-r9.mjs
          node qa-grip-offroad-r5.mjs
          node qa-power-wrx-r2.mjs
          node qa/DEV_DRIVING_SIM_QA.mjs
          npm run qa:stress
      - name: Production build
        run: npm run build
      - name: Commit drift stress cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/tire-model.js src/physics/per-wheel-shadow-solver.js src/wheel-ground-support.js src/vehicle-presentation-v21.29.js src/vehicle-dynamics-base.js src/driving-runtime-base.js src/main.js
          git commit -m "Drift R10: continuous per-wheel road-dirt transitions"
          git push
