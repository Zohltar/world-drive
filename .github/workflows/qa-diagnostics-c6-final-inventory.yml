name: C6 Final Global Boundary QA

on:
  push:
    branches:
      - audit/diagnostics-c6-final
      - dev
    paths:
      - 'src/**'
      - 'qa/qa-diagnostics-c6-final-inventory.mjs'
      - '.github/workflows/qa-diagnostics-c6-final-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Final C6 global boundary
        run: node qa/qa-diagnostics-c6-final-inventory.mjs
