name: Cleanup C1 Ready Validation

on:
  push:
    branches:
      - cleanup/vehicle-dynamics-c1-ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Finalize one-shot materialization
        run: |
          if [ -f tools/finalize-c1-materialization.mjs ]; then
            node tools/finalize-c1-materialization.mjs
          else
            echo "C1 materialization already finalized"
          fi
      - name: C1 ownership
        run: node qa-vehicle-dynamics-c1.mjs
      - name: Critical steering and wheelspin regressions
        run: |
          node qa-grip-steering-curve-r3.mjs
          node qa-grip-steering-input-r13.mjs
          node qa-grip-f1-steering-r22.mjs
          node qa-wheelspin-state-b6.mjs
          node qa-momentum-direction-b4.mjs
          node qa-grip-handbrake-r1.mjs
      - name: Clutch and vehicle dynamics regressions
        run: |
          node qa/V21_29_ALL_COMBUSTION_CLUTCH_QA.mjs
          node qa/V21_29_CIVIC_CLUTCH_DUMP_SLIP_QA.mjs
          node qa/V21_29_CIVIC_CLUTCH_WHEELSPIN_QA.mjs
          node qa/V21_29_CLUTCH_SHOCK_QA.mjs
          node qa/V21_29_CLUTCH_SHOCK_FLEET_QA.mjs
          node qa/V21_29_RUNTIME_WHEELSPIN_QA.mjs
          node qa/V21_30_ANTI_ROLL_BALANCE_QA.mjs
          node qa/V21_30_STATIONARY_STEERING_YAW_QA.mjs
          node qa/V21_30_BRAKE_HOLD_STOP_QA.mjs
          node qa/V21_30_TRUCK_HILL_TORQUE_QA.mjs
          node qa/V21_31_AIRBORNE_TIRE_STATE_QA.mjs
      - name: Driving matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Stress
        run: npm run qa:stress
      - name: Build
        run: npm run build
      - name: Diff hygiene
        run: git diff --check
      - name: Commit finalized non-workflow changes
        run: |
          if git diff --quiet; then
            echo "No generated C1 changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Cleanup C1: remove historical vehicle dynamics layers"
          git push origin HEAD:cleanup/vehicle-dynamics-c1-ready
