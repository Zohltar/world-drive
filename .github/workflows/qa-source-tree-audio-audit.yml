name: Source Tree Audio Audit

on:
  push:
    branches:
      - audit/source-tree-audio
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audio source-tree audit
        run: node qa-source-tree-audio.mjs
      - name: Skid audio linkage QA
        run: node qa/V21_29_SKID_AUDIO_LINK_QA.mjs
      - name: Skid audio curve QA
        run: node qa/V21_29_SKID_AUDIO_CURVE_QA.mjs
      - name: Runtime import/source-tree audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
