name: Apply Grip R1 handbrake physics

on:
  push:
    branches:
      - grip/v21.31
    paths:
      - '.github/workflows/grip-r1-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply physical handbrake combined-slip model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old,new,1)

          # --- Runtime: persistent rear-wheel slip state and smooth recovery ---
          p=Path('src/driving-runtime-base.js')
          s=p.read_text()

          old="""export function handbrakeLateralEffectForSpeed(speedAbs=0){
            return smoothstep01((Math.max(0,Number(speedAbs)||0)-2.5)/6.5);
          }

          export function landingSideslipGripSeed"""
          new="""export function handbrakeLateralEffectForSpeed(speedAbs=0){
            return smoothstep01((Math.max(0,Number(speedAbs)||0)-2.5)/6.5);
          }

          // Grip R1 — rear wheel lock is a continuous tire state, not the handbrake
          // button itself. Wheel lock builds quickly, but after release the tire must
          // spin back toward road speed before static adhesion is recovered. A car
          // that is still travelling sideways therefore takes longer to regain grip.
          export function advanceHandbrakeRearSlipState({
            previous=0,
            handbrake=false,
            airborne=false,
            speedAbs=0,
            sideslipRad=0,
            dt=0
          }={}){
            const prev=Math.max(0,Math.min(1,Number(previous)||0));
            const step=Math.min(.05,Math.max(0,Number(dt)||0));
            if(step<=0)return prev;
            if(airborne)return prev*Math.exp(-step/.08);

            const speed=Math.max(0,Math.abs(Number(speedAbs)||0));
            const beta=Math.min(Math.PI*.5,Math.abs(Number(sideslipRad)||0));
            const speedAuthority=handbrakeLateralEffectForSpeed(speed);
            const target=handbrake?speedAuthority:0;

            // Hydraulic/mechanical rear lock happens quickly. Recovery is governed
            // by wheel spin-up and the remaining contact-patch slip velocity.
            const engageTau=.045;
            const speedT=smoothstep01(speed/30);
            const sideslipT=smoothstep01(beta/.55);
            const releaseTau=.11+.09*speedT+.24*sideslipT;
            const tau=target>prev?engageTau:releaseTau;
            return prev+(target-prev)*(1-Math.exp(-step/Math.max(.02,tau)));
          }

          export function landingSideslipGripSeed"""
          s=replace_once(s,old,new,'runtime helper insertion')

          old="""  const physicsShadow=createPerWheelShadowSolver({hz:120,maxSubSteps:8});
            let wasAirborne=false;
          """
          new="""  const physicsShadow=createPerWheelShadowSolver({hz:120,maxSubSteps:8});
            let wasAirborne=false;
            let rearHandbrakeSlipState=0;
          """
          s=replace_once(s,old,new,'runtime state insertion')

          old="""    const speedAbs=Math.abs(speed);
            let assistedTurn=turn;
          """
          new="""    const speedAbs=Math.abs(speed);
            const currentSideslip=travelAxisSideslip({heading,velocityHeading});
            rearHandbrakeSlipState=advanceHandbrakeRearSlipState({
              previous:rearHandbrakeSlipState,
              handbrake:hand,
              airborne:airborneNow,
              speedAbs,
              sideslipRad:currentSideslip,
              dt
            });
            let assistedTurn=turn;
          """
          s=replace_once(s,old,new,'runtime slip state advance')

          old="""        surfaceMu:longitudinalMu,throttle:driveThrottle,handbrake:hand,airborne:airborneNow,vehicle:VEHICLE,speedAbs,
                contacts:vehiclePresentation?.wheelContacts||[],previousUsage:wheelGripUsage,dt:gripDt
          """
          new="""        surfaceMu:longitudinalMu,throttle:driveThrottle,handbrake:hand,
                handbrakeSlipState:rearHandbrakeSlipState,sideslipRad:currentSideslip,
                airborne:airborneNow,vehicle:VEHICLE,speedAbs,
                contacts:vehiclePresentation?.wheelContacts||[],previousUsage:wheelGripUsage,dt:gripDt
          """
          s=replace_once(s,old,new,'runtime solver args')

          old="""    const handbrakeLateralEffect=hand&&!airborneNow?handbrakeLateralEffectForSpeed(speedAbs):1;
            const targetFrontSlip=perWheelGrip.frontLateral;
            const targetRearSlip=perWheelGrip.rearLateral*handbrakeLateralEffect;
            let frictionYawAccel=Number.isFinite(perWheelGrip.frictionYawAccel)?perWheelGrip.frictionYawAccel:0;
            const rawNetLateralAccel=Number.isFinite(perWheelGrip.netLateralAccel)?perWheelGrip.netLateralAccel:physicalSignedLatAccel;
            const rawRearLateralForceScale=Number.isFinite(perWheelGrip.rearLateralForceScale)?physicsClamp(perWheelGrip.rearLateralForceScale,0,1):1;

            if(hand&&!airborneNow)frictionYawAccel*=handbrakeLateralEffect;
            const netLateralAccel=hand&&!airborneNow
              ?physicalSignedLatAccel+(rawNetLateralAccel-physicalSignedLatAccel)*handbrakeLateralEffect
              :rawNetLateralAccel;
            const rearLateralForceScale=hand&&!airborneNow
              ?1-(1-rawRearLateralForceScale)*handbrakeLateralEffect
              :rawRearLateralForceScale;
          """
          new="""    // Grip R1 — force recovery follows tire slip state, not the button edge.
            // The wheel solver already includes the speed-dependent lock fraction, so
            // its output can be used directly without an instantaneous handbrake gate.
            const targetFrontSlip=perWheelGrip.frontLateral;
            const sideslipDrivenRearSlip=
              rearHandbrakeSlipState*
              smoothstep01((currentSideslip-.025)/.42)*
              .90;
            const targetRearSlip=Math.max(perWheelGrip.rearLateral,sideslipDrivenRearSlip);
            let frictionYawAccel=Number.isFinite(perWheelGrip.frictionYawAccel)?perWheelGrip.frictionYawAccel:0;
            const netLateralAccel=Number.isFinite(perWheelGrip.netLateralAccel)?perWheelGrip.netLateralAccel:physicalSignedLatAccel;
            const rearLateralForceScale=Number.isFinite(perWheelGrip.rearLateralForceScale)?physicsClamp(perWheelGrip.rearLateralForceScale,0,1):1;
          """
          s=replace_once(s,old,new,'runtime force continuity block')

          old="""      const rawTrajectoryLateralCapacityAccel=Number.isFinite(perWheelGrip.trajectoryLateralCapacityAccel)?Math.max(0,perWheelGrip.trajectoryLateralCapacityAccel):Math.max(0,latLimit);
                const trajectoryLateralCapacityAccel=hand&&!airborneNow
                  ?latLimit+(rawTrajectoryLateralCapacityAccel-latLimit)*handbrakeLateralEffect
                  :rawTrajectoryLateralCapacityAccel;
          """
          new="""      const rawTrajectoryLateralCapacityAccel=Number.isFinite(perWheelGrip.trajectoryLateralCapacityAccel)?Math.max(0,perWheelGrip.trajectoryLateralCapacityAccel):Math.max(0,latLimit);
                const trajectoryLateralCapacityAccel=rawTrajectoryLateralCapacityAccel;
          """
          s=replace_once(s,old,new,'runtime trajectory continuity')
          p.write_text(s)

          # --- Tire solver: kinetic sliding friction vector under combined slip ---
          p=Path('src/vehicle-dynamics-base.js')
          s=p.read_text()

          old="""export function estimateWheelGripUsage({requestedLatAccel,signedLatAccel,latLimit,longitudinalAccel,propulsionAccel=null,serviceBrakeAccel=null,surfaceMu=1,throttle,handbrake,airborne,vehicle,speedAbs=null,dt,contacts=[],previousUsage=[]}={},out=null){"""
          new="""export function estimateWheelGripUsage({requestedLatAccel,signedLatAccel,latLimit,longitudinalAccel,propulsionAccel=null,serviceBrakeAccel=null,surfaceMu=1,throttle,handbrake,handbrakeSlipState=null,sideslipRad=0,airborne,vehicle,speedAbs=null,dt,contacts=[],previousUsage=[]}={},out=null){"""
          s=replace_once(s,old,new,'base solver signature')

          old="""  const tireSpeed=Math.max(0,safeNumber(speedAbs,50));
            const aeroEnabled="""
          new="""  const tireSpeed=Math.max(0,safeNumber(speedAbs,50));
            const rearHandbrakeSlip=airborne
              ?0
              :clampDynamics(safeNumber(handbrakeSlipState,handbrake?1:0),0,1);
            // Peak/static tire friction is higher than fully sliding friction. This
            // ratio is deliberately configurable per vehicle but defaults to a
            // realistic road-tire sliding plateau rather than an arbitrary 6% grip.
            const handbrakeSlidingMuRatio=clampDynamics(
              safeNumber(vehicle?.handbrakeSlidingMuRatio,.84),
              .65,.95
            );
            const handbrakeSideslip=Math.min(
              Math.PI*.5,
              Math.abs(safeNumber(sideslipRad,0))
            );
            const aeroEnabled="""
          s=replace_once(s,old,new,'base solver state definitions')

          old="""    longitudinalUtil=clampDynamics(longitudinalUtil,0,1.35);
                if(handbrake&&isRear&&!airborne)longitudinalUtil=Math.max(longitudinalUtil,1.28);

                // V21.21.10 — friction-circle coupling. Longitudinal tire demand now
                // consumes the same adhesion budget used for cornering. A locked rear wheel
                // therefore has very little lateral authority left, so a handbrake while
                // turning can naturally create rear-dominant slip. In a straight line,
                // baseLateralUtil is zero, so the handbrake does not invent a yaw moment.
                const circleLongitudinal=clampDynamics(longitudinalUtil,0,1);
                const lateralCapacity=Math.sqrt(Math.max(0,1-circleLongitudinal*circleLongitudinal));
                const residualLateralCapacity=
                  handbrake&&isRear&&!airborne
                    ?.06
                    :.12;
                const usableLateralCapacity=Math.max(residualLateralCapacity,lateralCapacity);
          """
          new="""    longitudinalUtil=clampDynamics(longitudinalUtil,0,1.35);

                // Grip R1 — a locked tire still generates kinetic friction. Its force
                // vector opposes contact-patch slip velocity, so when the car is sideways
                // a meaningful part of that sliding-friction vector is lateral. This is
                // the physical reason a handbrake slide does not feel like ice.
                const rearSlipBlend=isRear&&!airborne?rearHandbrakeSlip:0;
                let slidingLateralCapacity=0;
                if(rearSlipBlend>1e-4){
                  const slidingLongitudinalCapacity=
                    handbrakeSlidingMuRatio*Math.abs(Math.cos(handbrakeSideslip));
                  slidingLateralCapacity=
                    handbrakeSlidingMuRatio*Math.abs(Math.sin(handbrakeSideslip));
                  longitudinalUtil=Math.max(
                    longitudinalUtil,
                    slidingLongitudinalCapacity*rearSlipBlend
                  );
                }

                // Rolling tires keep the normal friction-circle coupling. As wheel lock
                // builds we blend continuously toward the kinetic-friction vector above;
                // on release the same blend decays with wheel spin-up instead of snapping.
                const circleLongitudinal=clampDynamics(longitudinalUtil,0,1);
                const lateralCapacity=Math.sqrt(Math.max(0,1-circleLongitudinal*circleLongitudinal));
                const rollingLateralCapacity=Math.max(.12,lateralCapacity);
                const lockedLateralCapacity=Math.max(.02,slidingLateralCapacity);
                const usableLateralCapacity=
                  rearSlipBlend>1e-4
                    ?rollingLateralCapacity+
                      (lockedLateralCapacity-rollingLateralCapacity)*rearSlipBlend
                    :rollingLateralCapacity;
          """
          s=replace_once(s,old,new,'base combined slip block')

          old="""    const combined=airborne?0:Math.sqrt(baseLateralUtil*baseLateralUtil+longitudinalUtil*longitudinalUtil);
                raw[i]=Math.min(1.65,combined);
          """
          new="""    const combined=airborne?0:Math.sqrt(baseLateralUtil*baseLateralUtil+longitudinalUtil*longitudinalUtil);
                const lockedSlipFloor=rearSlipBlend>0?.98+.30*rearSlipBlend:0;
                raw[i]=Math.max(Math.min(1.65,combined),lockedSlipFloor);
          """
          s=replace_once(s,old,new,'base locked slip telemetry')

          old="""  result.absServiceBrakeUtil=absServiceBrakeUtil;
            // Positive signed lateral acceleration"""
          new="""  result.absServiceBrakeUtil=absServiceBrakeUtil;
            result.handbrakeRearSlipState=rearHandbrakeSlip;
            result.handbrakeSlidingMuRatio=handbrakeSlidingMuRatio;
            result.handbrakeSideslipRad=handbrakeSideslip;
            // Positive signed lateral acceleration"""
          s=replace_once(s,old,new,'base diagnostics')
          p.write_text(s)

          # --- Deterministic QA for lock, lateral friction, and release ---
          qa=Path('qa-grip-handbrake-r1.mjs')
          qa.write_text(r'''import assert from 'node:assert/strict';
          import {advanceHandbrakeRearSlipState} from './src/driving-runtime-base.js';
          import {estimateWheelGripUsage} from './src/vehicle-dynamics-base.js';

          function evolve({state=0,handbrake=false,speedAbs=20,sideslipRad=0,seconds=.1,dt=.01}={}){
            let value=state;
            for(let t=0;t<seconds-1e-9;t+=dt){
              value=advanceHandbrakeRearSlipState({
                previous:value,handbrake,airborne:false,speedAbs,sideslipRad,dt
              });
            }
            return value;
          }

          const engaged=evolve({handbrake:true,speedAbs:20,seconds:.12});
          assert.ok(engaged>.88,`rear lock should engage quickly, got ${engaged}`);

          const oneFrameRelease=advanceHandbrakeRearSlipState({
            previous:1,handbrake:false,airborne:false,speedAbs:20,
            sideslipRad:.45,dt:1/60
          });
          assert.ok(oneFrameRelease>.90,`release must not restore full grip in one frame: ${oneFrameRelease}`);

          const partialRelease=evolve({state:1,handbrake:false,speedAbs:20,sideslipRad:.45,seconds:.20});
          assert.ok(partialRelease>.35&&partialRelease<.80,`0.2 s release should remain transitional: ${partialRelease}`);

          const settled=evolve({state:1,handbrake:false,speedAbs:20,sideslipRad:0,seconds:1.5});
          assert.ok(settled<.01,`rear tire should eventually return to rolling adhesion: ${settled}`);

          const vehicle={
            massKg:1500,wheelbase:2.65,trackWidth:1.56,frontWeightBias:.58,
            cgHeight:.52,drivetrain:'AWD',frontTireGripScale:1,rearTireGripScale:1,
            absEnabled:true,handbrakeSlidingMuRatio:.84
          };
          function grip(slipState,beta){
            return estimateWheelGripUsage({
              requestedLatAccel:6,signedLatAccel:6,latLimit:8,
              longitudinalAccel:0,propulsionAccel:0,serviceBrakeAccel:0,
              surfaceMu:1,throttle:0,handbrake:slipState>.99,
              handbrakeSlipState:slipState,sideslipRad:beta,
              airborne:false,vehicle,speedAbs:20,dt:.016,
              contacts:[],previousUsage:[0,0,0,0]
            },{});
          }

          const rolling=grip(0,0);
          const locked20=grip(1,20*Math.PI/180);
          const locked45=grip(1,45*Math.PI/180);
          assert.ok(rolling.rearLateralForceScale>.90,'rolling rear axle should retain normal lateral force');
          assert.ok(locked20.rearLateralForceScale>.15,'a sideways locked tire must retain meaningful lateral sliding friction');
          assert.ok(locked20.rearLateralForceScale<rolling.rearLateralForceScale-.10,'locked rear must remain below rolling peak grip');
          assert.ok(locked45.rearLateralForceScale>locked20.rearLateralForceScale+.12,'lateral sliding friction should grow with sideslip angle');
          assert.equal(locked20.handbrakeSlidingMuRatio,.84);

          console.log('PASS Grip R1 physical handbrake recovery');
          console.log({engaged,oneFrameRelease,partialRelease,settled,
            rollingRear:rolling.rearLateralForceScale,
            locked20Rear:locked20.rearLateralForceScale,
            locked45Rear:locked45.rearLateralForceScale});
          ''')

          # Run this branch through the normal integration matrix too.
          p=Path('.github/workflows/qa-dev-integration.yml')
          s=p.read_text()
          s=replace_once(s,
            """      - traffic/v21.31
            workflow_dispatch:""",
            """      - traffic/v21.31
                  - grip/v21.31
            workflow_dispatch:""",
            'workflow grip branch')
          s=replace_once(s,
            """      - name: Driving dynamics simulation matrix
                run: node qa/DEV_DRIVING_SIM_QA.mjs
            """,
            """      - name: Driving dynamics simulation matrix
                run: node qa/DEV_DRIVING_SIM_QA.mjs
              - name: Grip R1 physical handbrake recovery QA
                run: node qa-grip-handbrake-r1.mjs
            """,
            'workflow grip QA step')
          p.write_text(s)
          PY

          node qa-grip-handbrake-r1.mjs
          node qa/DEV_DRIVING_SIM_QA.mjs

      - name: Commit Grip R1
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/grip-r1-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/driving-runtime-base.js src/vehicle-dynamics-base.js qa-grip-handbrake-r1.mjs .github/workflows/qa-dev-integration.yml .github/workflows/grip-r1-apply.yml
          git commit -m "Grip R1: physical handbrake slip and progressive regrip"
          git push
