name: Prepare Block 8 canonical documentation
on:
  push:
    branches: [docs/block8-biome-r3-restart-sync]
    paths: [.github/workflows/sync-block8-biome-docs.yml]
permissions:
  contents: write
jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/sync-block8-docs.py
      - name: Commit only documentation on preparation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/WORLD_DRIVE_EVOLUTION_AND_CORRECTION_PLAN.md docs/WORLD_DRIVE_BLOCK8_ACTIVE_CANDIDATE.md
          git commit -m 'docs: synchronize canonical Block 8 restart with validated R1-R3'
          git push origin HEAD:docs/block8-biome-r3-restart-sync
      - uses: actions/upload-artifact@v4
        with:
          name: block8-canonical-docs
          path: |
            docs/WORLD_DRIVE_EVOLUTION_AND_CORRECTION_PLAN.md
            docs/WORLD_DRIVE_BLOCK8_ACTIVE_CANDIDATE.md
