name: Validate Cleanup B5 yaw ownership

on:
  push:
    branches:
      - cleanup/yaw-b5
    paths:
      - 'qa/apply-yaw-b5-temp.mjs'
      - 'qa-yaw-authority-b5.mjs'
      - 'qa-grip-f1-legacy-r23.mjs'
      - '.github/workflows/yaw-b5-validate-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply B5 extraction
        run: node qa/apply-yaw-b5-temp.mjs
      - name: B5 ownership and numerical equivalence
        run: node qa-yaw-authority-b5.mjs
      - name: Yaw / drift critical regressions
        run: |
          node qa-grip-countersteer-r7.mjs
          node qa-grip-high-speed-r11.mjs
          node qa-grip-fwd-power-r16.mjs
          node qa-grip-ev-jturn-r17.mjs
          node qa-grip-jturn-legacy-r19.mjs
          node qa-grip-handbrake-lateral-r20.mjs
          node qa-grip-f1-front-slip-r21.mjs
          node qa-grip-f1-legacy-r23.mjs
      - name: Fleet stress / driving matrix
        run: |
          node qa/DEV_DRIVING_SIM_QA.mjs
          npm run qa:stress
      - name: Production build
        run: npm run build
      - name: Commit B5 candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/physics/yaw-authority.js src/driving-runtime-base.js qa-yaw-authority-b5.mjs qa-grip-f1-legacy-r23.mjs
          git diff --cached --quiet || git commit -m 'Cleanup B5: extract yaw authority ownership'
          git push
