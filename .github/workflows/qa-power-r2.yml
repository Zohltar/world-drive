name: Power R2 WRX QA

on:
  push:
    branches:
      - power/v21.31
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Power R1 architecture QA
        run: node qa-power-wrx-r1.mjs
      - name: Power R2 WRX midrange torque QA
        run: node qa-power-wrx-r2.mjs
      - name: Grip and braking compatibility
        run: |
          node qa-grip-countersteer-r7.mjs
          node qa-grip-braking-r8.mjs
          node qa-grip-braking-r9.mjs
      - name: Production build
        run: npm run build
