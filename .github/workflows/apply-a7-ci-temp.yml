name: Apply A7 CI candidate
on:
  push:
    branches: ['audit/code-debt-a7']
    paths:
      - 'qa/apply-a7-ci-temp.mjs'
      - '.github/workflows/apply-a7-ci-temp.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node qa/apply-a7-ci-temp.mjs
      - name: Commit CI gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/qa-dev-integration.yml
          git diff --cached --quiet || git commit -m 'Cleanup A7 candidate: add repository hygiene gate'
          git push
