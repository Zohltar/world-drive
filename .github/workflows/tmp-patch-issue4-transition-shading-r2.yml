name: Temporary Issue 4 Transition Shading R2 Patch

on:
  push:
    branches:
      - candidate/issue4-transition-shading-r2

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Chore: seed transition shading r2 patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch sync and incremental transition shading floors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p927 = Path('src/terrain.js')
          s927 = p927.read_text()
          old927 = 'const shade=Math.max(.34,Math.min(1.36,.72+directional*.46-slope*.10));'
          new927 = 'const shade=Math.max(.56,Math.min(1.36,.72+directional*.46-slope*.10));'
          if s927.count(old927) != 1:
              raise SystemExit(f'expected one P9.27 transition shade floor, found {s927.count(old927)}')
          p927.write_text(s927.replace(old927, new927))

          p925 = Path('src/terrain-p925.js')
          s925 = p925.read_text()
          start = s925.index('function applyRoadBedTerrainColors(geometry)')
          end = s925.index('function applyHillshadeColors(geometry', start)
          block = s925[start:end]
          pattern = re.compile(r'shade\s*=\s*Math\.max\(\s*\.34,\s*Math\.min\(\s*1\.36,\s*shade\s*\)\s*\);')
          matches = list(pattern.finditer(block))
          if len(matches) != 1:
              raise SystemExit(f'expected one P9.25 transition shade floor, found {len(matches)}')
          block = pattern.sub('shade=Math.max(.56,Math.min(1.36,shade));', block, count=1)
          p925.write_text(s925[:start] + block + s925[end:])
          PY
          git diff --check
      - name: Commit focused patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/terrain.js src/terrain-p925.js
          git commit -m "Fix Photo OFF transition shading floor on both paths"
          git push origin HEAD:candidate/issue4-transition-shading-r2
