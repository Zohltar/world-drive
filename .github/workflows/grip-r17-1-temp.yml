name: Grip R17.1 temporary patch
on:
  push:
    branches: [dev]
    paths:
      - 'qa/apply-grip-r17-1-temp.mjs'
      - '.github/workflows/grip-r17-1-temp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Grip R17.1
        run: node qa/apply-grip-r17-1-temp.mjs
      - name: Runtime contract and focused QA
        run: |
          node --check src/driving-runtime-base.js
          ! grep -nE '\brequestedDriveAccel\s*\*=' src/driving-runtime-base.js
          grep -n 'requestedBodyDriveAccel\*=' src/driving-runtime-base.js
          node qa-grip-ev-jturn-r17.mjs
          node qa-grip-braking-r9.mjs
          node qa-grip-countersteer-r7.mjs
          node qa-grip-fwd-power-r16.mjs
      - name: Full driving and build QA
        run: |
          node qa/DEV_DRIVING_SIM_QA.mjs
          npm run qa:stress
          npm run build
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/driving-runtime-base.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Grip R17.1: fix body-axis drive scaling runtime path'
          git push origin HEAD:dev
