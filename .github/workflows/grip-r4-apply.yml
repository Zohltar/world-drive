name: Apply Grip R4 anti-spin cleanup

on:
  push:
    branches:
      - grip/v21.31
    paths:
      - 'tools/apply-grip-r4.mjs'
      - '.github/workflows/grip-r4-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply Grip R4
        run: node tools/apply-grip-r4.mjs
      - name: Validate Grip R4 and existing grip work
        run: |
          node qa-grip-drift-r4.mjs
          node qa-grip-handbrake-r1.mjs
          node qa-grip-steering-curve-r3.mjs
          node qa/V21_27_POST_180_REVERSE_STEERING_QA.mjs
          node qa/V21_27_WRX_POST_180_REVERSE_STEER_QA.mjs
          node qa/V21_27_J_TURN_PORTLAND_QA.mjs
          npm run qa:stress
      - name: Commit Grip R4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/driving-runtime-base.js qa-grip-drift-r4.mjs
          git commit -m "Grip R4: remove 90-degree legacy anti-spin wall"
          git push
