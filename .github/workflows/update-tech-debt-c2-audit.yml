name: Sync C2 Audit Plan

on:
  push:
    branches:
      - dev
    paths:
      - 'tools/update-tech-debt-c2-audit.mjs'
      - '.github/workflows/update-tech-debt-c2-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update persistent plan
        run: node tools/update-tech-debt-c2-audit.mjs
      - name: Commit plan update and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Docs: record C2 transmission audit findings"
          git push origin HEAD:dev
