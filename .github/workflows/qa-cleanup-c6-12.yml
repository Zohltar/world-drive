name: Cleanup C6.12 Traffic Runtime Diagnostics QA

on:
  push:
    branches:
      - cleanup/diagnostics-c6-12
      - dev
    paths:
      - 'src/civil-traffic.js'
      - 'src/civil-traffic-local.js'
      - 'src/civil-traffic-network-bridge.js'
      - 'src/diagnostics.js'
      - 'qa-diagnostics-c6-*.mjs'
      - 'qa-traffic-*.mjs'
      - '.github/workflows/qa-cleanup-c6-12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: C6.1-C6.12 diagnostics QA
        run: |
          node qa-diagnostics-c6-1.mjs
          node qa-diagnostics-c6-2.mjs
          node qa-diagnostics-c6-3.mjs
          node qa-diagnostics-c6-4.mjs
          node qa-diagnostics-c6-5.mjs
          node qa-diagnostics-c6-6.mjs
          node qa-diagnostics-c6-7.mjs
          node qa-diagnostics-c6-8.mjs
          node qa-diagnostics-c6-9.mjs
          node qa-diagnostics-c6-10.mjs
          node qa-diagnostics-c6-11.mjs
          node qa-diagnostics-c6-12.mjs
      - name: Civil traffic regressions
        run: |
          node qa-traffic-r1.mjs
          node qa-traffic-pool-r1.mjs
          node qa-traffic-preload-p1.mjs
          node qa-traffic-mp1.mjs
          node qa-traffic-mp1-live.mjs
      - name: Multiplayer protocol QA
        run: node qa/V21_31_MULTIPLAYER_M3_PROTOCOL_QA.mjs
      - name: Driving dynamics simulation matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Full V21.31 regression stress
        run: npm run qa:stress
      - name: Runtime import and debt audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
