name: R6 Water Candidate QA

on:
  push:
    branches:
      - candidate/r6-water
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: R6 water source-tree boundary
        run: node qa/qa-source-tree-r6-water.mjs
      - name: Runtime import and debt audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Water implementation syntax
        run: |
          node --check src/water/water-data.js
          node --check src/water/water-renderer.js
      - name: R6 scenery renderer boundary
        run: node qa/qa-source-tree-r6-scenery-renderer.mjs
      - name: Forest/scenery startup boundary
        run: node qa/qa-forest-p933-startup-gate.mjs
      - name: Streaming P9.25 scenery/preparation QA
        run: node qa/qa-streaming-p925-scenery-and-prep.mjs
      - name: Combined frame-pacing QA
        run: node qa/qa-p937-combined-frame-pacing.mjs
      - name: Full V21.31 regression stress
        run: npm run qa:stress
      - name: Live route preset smoke
        run: node qa/STRESS_ROUTE_PRESETS_LIVE.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
