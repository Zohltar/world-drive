name: Source Tree R7 Routing QA

on:
  push:
    branches:
      - dev
      - candidate/r7-routing-r1
    paths:
      - 'src/routing.js'
      - 'src/routing-service.js'
      - 'src/route-lifecycle.js'
      - 'src/route-presets.js'
      - 'src/route-challenge.js'
      - 'src/geocoding.js'
      - 'src/routing/**'
      - 'qa/qa-source-tree-r7-routing.mjs'
      - 'qa/V21_26_ROUTE_LIFECYCLE_REFACTOR_QA.mjs'
      - 'qa/V21_26_ROUTE_PLANNER_REFACTOR_QA.mjs'
      - '.github/workflows/qa-source-tree-r7-routing.yml'
      - '.github/workflows/qa-dev-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: R7 routing source-tree boundary
        run: node qa/qa-source-tree-r7-routing.mjs
      - name: Route lifecycle regression
        run: node qa/V21_26_ROUTE_LIFECYCLE_REFACTOR_QA.mjs
      - name: Route planner regression
        run: node qa/V21_26_ROUTE_PLANNER_REFACTOR_QA.mjs
      - name: Forest route-cache reset regression
        run: node qa/qa-forest-route-cache-reset.mjs
      - name: Runtime import and debt audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
