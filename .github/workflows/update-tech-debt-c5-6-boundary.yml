name: Update Tech Debt C5.6 Boundary

on:
  push:
    branches:
      - docs/c5-6-boundary
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update plan
        run: node tools/update-tech-debt-c5-6-boundary.mjs
      - name: Commit plan
        shell: bash
        run: |
          if git diff --quiet -- docs/WORLD_DRIVE_TECH_DEBT_PLAN.md; then
            echo 'No plan change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/WORLD_DRIVE_TECH_DEBT_PLAN.md
          git commit -m 'Docs: record C5.6 selected boundary'
          git push
