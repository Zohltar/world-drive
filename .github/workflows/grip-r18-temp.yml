name: Grip R18 temporary patch
on:
  push:
    branches: [dev]
    paths:
      - 'qa/apply-grip-r18-temp.mjs'
      - 'qa-grip-ev-maneuver-r18.mjs'
      - '.github/workflows/grip-r18-temp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Grip R18
        run: node qa/apply-grip-r18-temp.mjs
      - name: Focused EV maneuver QA
        run: |
          node --check src/driving-runtime-base.js
          node --check src/physics/per-wheel-shadow-solver.js
          node qa-grip-ev-maneuver-r18.mjs
          node qa-grip-handbrake-r1.mjs
          node qa-grip-braking-r9.mjs
          node qa-grip-countersteer-r7.mjs
          node qa-grip-fwd-power-r16.mjs
          node qa-grip-ev-jturn-r17.mjs
      - name: Full driving and stress QA
        run: |
          node qa/DEV_DRIVING_SIM_QA.mjs
          npm run qa:stress
          npm run build
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/driving-runtime-base.js src/physics/per-wheel-shadow-solver.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Grip R18: preserve EV rotation through handbrake and J-turn'
          git push origin HEAD:dev
