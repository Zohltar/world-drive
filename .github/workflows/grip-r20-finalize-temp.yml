name: Grip R20 finalize runtime regression
on:
  push:
    branches: [dev]
    paths:
      - 'qa/finalize-grip-r20-probe-temp.mjs'
      - '.github/workflows/grip-r20-finalize-temp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node qa/finalize-grip-r20-probe-temp.mjs
      - run: node qa-grip-full-runtime-180-probe-r20.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa-grip-full-runtime-180-probe-r20.mjs
          git commit -m 'QA Grip R20: lock full-runtime handbrake rotation' 
          git push origin HEAD:dev
