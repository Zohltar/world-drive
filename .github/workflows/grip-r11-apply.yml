name: Apply Grip R11 high-speed trajectory fix

on:
  push:
    branches:
      - dev
    paths:
      - 'tools/apply-grip-r11-high-speed.mjs'
      - 'qa-grip-high-speed-r11.mjs'
      - '.github/workflows/grip-r11-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: "github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'CI Grip R11: prepare high-speed trajectory fix'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply Grip R11
        run: node tools/apply-grip-r11-high-speed.mjs
      - name: Grip R11 high-speed trajectory QA
        run: node qa-grip-high-speed-r11.mjs
      - name: Existing grip regression gates
        run: |
          node qa-grip-countersteer-r7.mjs
          node qa-grip-braking-r8.mjs
          node qa-grip-braking-r9.mjs
          node qa-grip-uphill-r10.mjs
          node qa-grip-drift-r4.mjs
          node qa-grip-jump-r6.mjs
          node qa/V21_27_WRX_CORNER_STABILITY_QA.mjs
          node qa/DEV_DRIVING_SIM_QA.mjs
          npm run qa:stress
      - name: Production build
        run: npm run build
      - name: Commit Grip R11
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/drift-force-coupling.js src/driving-runtime-base.js
          git commit -m "Grip R11: prevent elastic high-speed trajectory snapback"
          git push
