name: Apply Terrain R1 legacy cleanup

on:
  push:
    branches:
      - terrain/v21.31
    paths:
      - 'tools/apply-terrain-r1.mjs'
      - 'qa-terrain-r1-legacy-ownership.mjs'
      - '.github/workflows/terrain-r1-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply Terrain R1
        run: node tools/apply-terrain-r1.mjs
      - name: Terrain R1 ownership QA
        run: node qa-terrain-r1-legacy-ownership.mjs
      - name: Current terrain/road regression gates
        run: |
          node qa/V21_31_LEGACY_TERRAIN_AUTHORITY_QA.mjs
          node qa/V21_31_ROAD_SMOOTHING_QA.mjs
          npm run qa:stress
      - name: Production build
        run: npm run build
      - name: Commit Terrain R1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/terrain.js src/terrain-p925.js
          git commit -m "Terrain R1: remove legacy road earthwork visual pollution"
          git push
