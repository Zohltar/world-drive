name: Sync C2 A8 Technical Debt Plan

on:
  push:
    branches:
      - dev
    paths:
      - 'tools/update-tech-debt-c2-a8.mjs'
      - '.github/workflows/update-tech-debt-c2-a8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update persistent plan
        run: node tools/update-tech-debt-c2-a8.mjs
      - name: Commit plan sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Docs: close C2 and A8 cleanup records"
          git push origin HEAD:dev
