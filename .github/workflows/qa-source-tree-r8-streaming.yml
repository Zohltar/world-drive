name: R8 Streaming Structure QA

on:
  push:
    branches:
      - dev
      - candidate/r8-streaming-structure-r1
    paths:
      - 'src/streaming-coordinator.js'
      - 'src/streaming-coordinator-p913.js'
      - 'src/streaming/**'
      - 'qa/qa-source-tree-r8-streaming.mjs'
      - 'qa/qa-r8-current-ownership.mjs'
      - 'qa/qa-streaming-p913-transitions.mjs'
      - 'qa/V21_22_3_HITCH_FREE_QA.mjs'
      - 'qa/qa-diagnostics-c6-final-inventory.mjs'
      - 'qa/DEV_INTEGRATION_AUDIT.mjs'
      - '.github/workflows/qa-source-tree-r8-streaming.yml'
      - '.github/workflows/qa-cleanup-c6-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: R8.3 streaming source-tree boundary
        run: node qa/qa-source-tree-r8-streaming.mjs
      - name: R8 current ownership baseline
        run: node qa/qa-r8-current-ownership.mjs
      - name: P9.13 transition contract
        run: node qa/qa-streaming-p913-transitions.mjs
      - name: V21.22.3 hitch-free policy
        run: node qa/V21_22_3_HITCH_FREE_QA.mjs
      - name: C6 final global boundary
        run: node qa/qa-diagnostics-c6-final-inventory.mjs
      - name: P9.17 load smoothing
        run: node qa/qa-streaming-p917-load-smoothing.mjs
      - name: P9.18 loading
        run: node qa/qa-streaming-p918-loading.mjs
      - name: P9.23 scheduler
        run: node qa/qa-streaming-p923-scheduler.mjs
      - name: P9.24 frame budget
        run: node qa/qa-streaming-p924-frame-budget.mjs
      - name: Combined frame pacing
        run: node qa/qa-p937-combined-frame-pacing.mjs
      - name: Hitch attribution
        run: node qa/qa-p939-hitch-attribution.mjs
      - name: R8 issue 2 imagery diagnostics
        run: node qa/qa-r8-issue2-imagery-diagnostics.mjs
      - name: R8 streaming baseline
        run: node qa/qa-r8-streaming-baseline.mjs
      - name: Runtime import and source-tree audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
