name: Issue 4 Transition Natural Copy QA

on:
  push:
    branches:
      - candidate/issue4-transition-natural-copy-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Issue 4 transition natural-copy QA
        run: node qa/qa-issue4-transition-natural-copy.mjs
      - name: P9.25 scenery and prep QA
        run: node qa/qa-streaming-p925-scenery-and-prep.mjs
      - name: P9.27 road transition QA
        run: node qa/qa-streaming-p927-road-transition.mjs
      - name: R8 terrain source-tree QA
        run: node qa/qa-source-tree-r8-terrain.mjs
      - name: R8 streaming baseline aggregate
        run: node qa/qa-r8-streaming-baseline.mjs
      - name: Runtime import and source-tree audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
