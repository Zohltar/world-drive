name: R5b Wheel Ground Candidate QA

on:
  push:
    branches:
      - candidate/r5b-wheel-ground-support
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: R5b wheel ground source-tree boundary
        run: node qa/qa-source-tree-r5b-wheel-ground-support.mjs
      - name: Runtime import and debt audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Grip R14 road reentry vertical support
        run: node qa/qa-wheel-ground-reentry-r14.mjs
      - name: Driving dynamics simulation matrix
        run: node qa/DEV_DRIVING_SIM_QA.mjs
      - name: Crest launch regression
        run: node qa/V21_27_CREST_LAUNCH_QA.mjs
      - name: Oblique landing regression
        run: node qa/V21_27_OBLIQUE_LANDING_QA.mjs
      - name: Full regression stress
        run: npm run qa:stress
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
