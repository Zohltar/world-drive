name: Geofabrik Offline OSM QA

on:
  push:
    branches:
      - dev
      - candidate/geofabrik-profile-r1
      - candidate/geofabrik-hydro-gzip-r1
    paths:
      - 'tools/geofabrik/**'
      - 'qa/qa-geofabrik-tiles-r1.mjs'
      - 'qa/qa-geofabrik-profile-r1.mjs'
      - 'qa/qa-geofabrik-hydro-gzip-r1.mjs'
      - 'package.json'
      - '.gitignore'
      - '.github/workflows/qa-geofabrik-pbf-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Builder syntax
        run: node --check tools/geofabrik/build-world-tiles.mjs
      - name: Offline reader syntax
        run: node --check tools/geofabrik/offline-tile-source.mjs
      - name: Profiler syntax
        run: node --check tools/geofabrik/profile-world-tiles.mjs
      - name: Hydro gzip packer syntax
        run: node --check tools/geofabrik/pack-hydro-gzip-v2.mjs
      - name: Geofabrik tile pipeline QA
        run: node qa/qa-geofabrik-tiles-r1.mjs
      - name: Geofabrik layer profiler QA
        run: node qa/qa-geofabrik-profile-r1.mjs
      - name: Geofabrik hydro gzip QA
        run: node qa/qa-geofabrik-hydro-gzip-r1.mjs
      - name: Runtime import and debt audit
        run: node qa/DEV_INTEGRATION_AUDIT.mjs
      - name: Production build
        run: npm run build
      - name: Production code split QA
        run: node qa/BUILD_V21_31_CODE_SPLIT_QA.mjs
