name: Apply Grip R1 handbrake physics v2

on:
  push:
    branches:
      - grip/v21.31
    paths:
      - '.github/workflows/grip-r1-apply-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Grip R1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def once(s, old, new, label):
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              return s.replace(old,new,1)

          p=Path('src/driving-runtime-base.js'); s=p.read_text()
          s=once(s,
          "export function handbrakeLateralEffectForSpeed(speedAbs=0){\n  return smoothstep01((Math.max(0,Number(speedAbs)||0)-2.5)/6.5);\n}\n\nexport function landingSideslipGripSeed",
          "export function handbrakeLateralEffectForSpeed(speedAbs=0){\n  return smoothstep01((Math.max(0,Number(speedAbs)||0)-2.5)/6.5);\n}\n\n// Grip R1 — wheel lock/recovery is continuous, not tied to the button edge.\nexport function advanceHandbrakeRearSlipState({previous=0,handbrake=false,airborne=false,speedAbs=0,sideslipRad=0,dt=0}={}){\n  const prev=Math.max(0,Math.min(1,Number(previous)||0));\n  const step=Math.min(.05,Math.max(0,Number(dt)||0));\n  if(step<=0)return prev;\n  if(airborne)return prev*Math.exp(-step/.08);\n  const speed=Math.max(0,Math.abs(Number(speedAbs)||0));\n  const beta=Math.min(Math.PI*.5,Math.abs(Number(sideslipRad)||0));\n  const target=handbrake?handbrakeLateralEffectForSpeed(speed):0;\n  const engageTau=.045;\n  const speedT=smoothstep01(speed/30);\n  const sideslipT=smoothstep01(beta/.55);\n  const releaseTau=.11+.09*speedT+.24*sideslipT;\n  const tau=target>prev?engageTau:releaseTau;\n  return prev+(target-prev)*(1-Math.exp(-step/Math.max(.02,tau)));\n}\n\nexport function landingSideslipGripSeed",
          'runtime helper')
          s=once(s,
          "  const physicsShadow=createPerWheelShadowSolver({hz:120,maxSubSteps:8});\n  let wasAirborne=false;",
          "  const physicsShadow=createPerWheelShadowSolver({hz:120,maxSubSteps:8});\n  let wasAirborne=false;\n  let rearHandbrakeSlipState=0;",
          'runtime state')
          s=once(s,
          "    const speedAbs=Math.abs(speed);\n    let assistedTurn=turn;",
          "    const speedAbs=Math.abs(speed);\n    const currentSideslip=travelAxisSideslip({heading,velocityHeading});\n    rearHandbrakeSlipState=advanceHandbrakeRearSlipState({previous:rearHandbrakeSlipState,handbrake:hand,airborne:airborneNow,speedAbs,sideslipRad:currentSideslip,dt});\n    let assistedTurn=turn;",
          'runtime advance')
          s=once(s,
          "        surfaceMu:longitudinalMu,throttle:driveThrottle,handbrake:hand,airborne:airborneNow,vehicle:VEHICLE,speedAbs,\n        contacts:vehiclePresentation?.wheelContacts||[],previousUsage:wheelGripUsage,dt:gripDt",
          "        surfaceMu:longitudinalMu,throttle:driveThrottle,handbrake:hand,\n        handbrakeSlipState:rearHandbrakeSlipState,sideslipRad:currentSideslip,\n        airborne:airborneNow,vehicle:VEHICLE,speedAbs,\n        contacts:vehiclePresentation?.wheelContacts||[],previousUsage:wheelGripUsage,dt:gripDt",
          'runtime solver args')
          s=once(s,
          "    const handbrakeLateralEffect=hand&&!airborneNow?handbrakeLateralEffectForSpeed(speedAbs):1;\n    const targetFrontSlip=perWheelGrip.frontLateral;\n    const targetRearSlip=perWheelGrip.rearLateral*handbrakeLateralEffect;\n    let frictionYawAccel=Number.isFinite(perWheelGrip.frictionYawAccel)?perWheelGrip.frictionYawAccel:0;\n    const rawNetLateralAccel=Number.isFinite(perWheelGrip.netLateralAccel)?perWheelGrip.netLateralAccel:physicalSignedLatAccel;\n    const rawRearLateralForceScale=Number.isFinite(perWheelGrip.rearLateralForceScale)?physicsClamp(perWheelGrip.rearLateralForceScale,0,1):1;\n\n    if(hand&&!airborneNow)frictionYawAccel*=handbrakeLateralEffect;\n    const netLateralAccel=hand&&!airborneNow\n      ?physicalSignedLatAccel+(rawNetLateralAccel-physicalSignedLatAccel)*handbrakeLateralEffect\n      :rawNetLateralAccel;\n    const rearLateralForceScale=hand&&!airborneNow\n      ?1-(1-rawRearLateralForceScale)*handbrakeLateralEffect\n      :rawRearLateralForceScale;",
          "    // Grip R1: lateral force recovery follows residual rear tire slip.\n    const targetFrontSlip=perWheelGrip.frontLateral;\n    const sideslipDrivenRearSlip=rearHandbrakeSlipState*smoothstep01((currentSideslip-.025)/.42)*.90;\n    const targetRearSlip=Math.max(perWheelGrip.rearLateral,sideslipDrivenRearSlip);\n    let frictionYawAccel=Number.isFinite(perWheelGrip.frictionYawAccel)?perWheelGrip.frictionYawAccel:0;\n    const netLateralAccel=Number.isFinite(perWheelGrip.netLateralAccel)?perWheelGrip.netLateralAccel:physicalSignedLatAccel;\n    const rearLateralForceScale=Number.isFinite(perWheelGrip.rearLateralForceScale)?physicsClamp(perWheelGrip.rearLateralForceScale,0,1):1;",
          'runtime force block')
          s=once(s,
          "      const rawTrajectoryLateralCapacityAccel=Number.isFinite(perWheelGrip.trajectoryLateralCapacityAccel)?Math.max(0,perWheelGrip.trajectoryLateralCapacityAccel):Math.max(0,latLimit);\n      const trajectoryLateralCapacityAccel=hand&&!airborneNow\n        ?latLimit+(rawTrajectoryLateralCapacityAccel-latLimit)*handbrakeLateralEffect\n        :rawTrajectoryLateralCapacityAccel;",
          "      const rawTrajectoryLateralCapacityAccel=Number.isFinite(perWheelGrip.trajectoryLateralCapacityAccel)?Math.max(0,perWheelGrip.trajectoryLateralCapacityAccel):Math.max(0,latLimit);\n      const trajectoryLateralCapacityAccel=rawTrajectoryLateralCapacityAccel;",
          'runtime trajectory')
          p.write_text(s)

          p=Path('src/vehicle-dynamics-base.js'); s=p.read_text()
          s=once(s,
          "export function estimateWheelGripUsage({requestedLatAccel,signedLatAccel,latLimit,longitudinalAccel,propulsionAccel=null,serviceBrakeAccel=null,surfaceMu=1,throttle,handbrake,airborne,vehicle,speedAbs=null,dt,contacts=[],previousUsage=[]}={},out=null){",
          "export function estimateWheelGripUsage({requestedLatAccel,signedLatAccel,latLimit,longitudinalAccel,propulsionAccel=null,serviceBrakeAccel=null,surfaceMu=1,throttle,handbrake,handbrakeSlipState=null,sideslipRad=0,airborne,vehicle,speedAbs=null,dt,contacts=[],previousUsage=[]}={},out=null){",
          'solver signature')
          s=once(s,
          "  const tireSpeed=Math.max(0,safeNumber(speedAbs,50));\n  const aeroEnabled=",
          "  const tireSpeed=Math.max(0,safeNumber(speedAbs,50));\n  const rearHandbrakeSlip=airborne?0:clampDynamics(safeNumber(handbrakeSlipState,handbrake?1:0),0,1);\n  // Sliding tires operate below peak/static mu. Configurable per vehicle.\n  const handbrakeSlidingMuRatio=clampDynamics(safeNumber(vehicle?.handbrakeSlidingMuRatio,.84),.65,.95);\n  const handbrakeSideslip=Math.min(Math.PI*.5,Math.abs(safeNumber(sideslipRad,0)));\n  const aeroEnabled=",
          'solver state')
          s=once(s,
          "    longitudinalUtil=clampDynamics(longitudinalUtil,0,1.35);\n    if(handbrake&&isRear&&!airborne)longitudinalUtil=Math.max(longitudinalUtil,1.28);\n\n    // V21.21.10 — friction-circle coupling. Longitudinal tire demand now\n    // consumes the same adhesion budget used for cornering. A locked rear wheel\n    // therefore has very little lateral authority left, so a handbrake while\n    // turning can naturally create rear-dominant slip. In a straight line,\n    // baseLateralUtil is zero, so the handbrake does not invent a yaw moment.\n    const circleLongitudinal=clampDynamics(longitudinalUtil,0,1);\n    const lateralCapacity=Math.sqrt(Math.max(0,1-circleLongitudinal*circleLongitudinal));\n    const residualLateralCapacity=\n      handbrake&&isRear&&!airborne\n        ?.06\n        :.12;\n    const usableLateralCapacity=Math.max(residualLateralCapacity,lateralCapacity);",
          "    longitudinalUtil=clampDynamics(longitudinalUtil,0,1.35);\n\n    // Grip R1 — kinetic friction opposes contact-patch slip velocity. A locked\n    // rear tire therefore retains a sideslip-dependent lateral component rather\n    // than an arbitrary 6% floor. Rolling -> sliding is blended continuously.\n    const rearSlipBlend=isRear&&!airborne?rearHandbrakeSlip:0;\n    let slidingLateralCapacity=0;\n    if(rearSlipBlend>1e-4){\n      const slidingLongitudinalCapacity=handbrakeSlidingMuRatio*Math.abs(Math.cos(handbrakeSideslip));\n      slidingLateralCapacity=handbrakeSlidingMuRatio*Math.abs(Math.sin(handbrakeSideslip));\n      longitudinalUtil=Math.max(longitudinalUtil,slidingLongitudinalCapacity*rearSlipBlend);\n    }\n    const circleLongitudinal=clampDynamics(longitudinalUtil,0,1);\n    const lateralCapacity=Math.sqrt(Math.max(0,1-circleLongitudinal*circleLongitudinal));\n    const rollingLateralCapacity=Math.max(.12,lateralCapacity);\n    const lockedLateralCapacity=Math.max(.02,slidingLateralCapacity);\n    const usableLateralCapacity=rearSlipBlend>1e-4\n      ?rollingLateralCapacity+(lockedLateralCapacity-rollingLateralCapacity)*rearSlipBlend\n      :rollingLateralCapacity;",
          'solver combined slip')
          s=once(s,
          "    const combined=airborne?0:Math.sqrt(baseLateralUtil*baseLateralUtil+longitudinalUtil*longitudinalUtil);\n    raw[i]=Math.min(1.65,combined);",
          "    const combined=airborne?0:Math.sqrt(baseLateralUtil*baseLateralUtil+longitudinalUtil*longitudinalUtil);\n    const lockedSlipFloor=rearSlipBlend>0?.98+.30*rearSlipBlend:0;\n    raw[i]=Math.max(Math.min(1.65,combined),lockedSlipFloor);",
          'solver slip telemetry')
          s=once(s,
          "  result.absServiceBrakeUtil=absServiceBrakeUtil;\n  // Positive signed lateral acceleration",
          "  result.absServiceBrakeUtil=absServiceBrakeUtil;\n  result.handbrakeRearSlipState=rearHandbrakeSlip;\n  result.handbrakeSlidingMuRatio=handbrakeSlidingMuRatio;\n  result.handbrakeSideslipRad=handbrakeSideslip;\n  // Positive signed lateral acceleration",
          'solver diagnostics')
          p.write_text(s)

          Path('qa-grip-handbrake-r1.mjs').write_text('''import assert from "node:assert/strict";\nimport {advanceHandbrakeRearSlipState} from "./src/driving-runtime-base.js";\nimport {estimateWheelGripUsage} from "./src/vehicle-dynamics-base.js";\n\nfunction evolve({state=0,handbrake=false,speedAbs=20,sideslipRad=0,seconds=.1,dt=.01}={}){let v=state;for(let t=0;t<seconds-1e-9;t+=dt)v=advanceHandbrakeRearSlipState({previous:v,handbrake,airborne:false,speedAbs,sideslipRad,dt});return v;}\nconst engaged=evolve({handbrake:true,seconds:.12});\nassert.ok(engaged>.88);\nconst oneFrameRelease=advanceHandbrakeRearSlipState({previous:1,handbrake:false,speedAbs:20,sideslipRad:.45,dt:1/60});\nassert.ok(oneFrameRelease>.90);\nconst partialRelease=evolve({state:1,handbrake:false,sideslipRad:.45,seconds:.20});\nassert.ok(partialRelease>.35&&partialRelease<.80);\nconst settled=evolve({state:1,handbrake:false,sideslipRad:0,seconds:1.5});\nassert.ok(settled<.01);\nconst vehicle={massKg:1500,wheelbase:2.65,trackWidth:1.56,frontWeightBias:.58,cgHeight:.52,drivetrain:"AWD",frontTireGripScale:1,rearTireGripScale:1,absEnabled:true,handbrakeSlidingMuRatio:.84};\nfunction grip(s,b){return estimateWheelGripUsage({requestedLatAccel:6,signedLatAccel:6,latLimit:8,longitudinalAccel:0,propulsionAccel:0,serviceBrakeAccel:0,surfaceMu:1,throttle:0,handbrake:s>.99,handbrakeSlipState:s,sideslipRad:b,airborne:false,vehicle,speedAbs:20,dt:.016,contacts:[],previousUsage:[0,0,0,0]},{});}\nconst rolling=grip(0,0),locked20=grip(1,20*Math.PI/180),locked45=grip(1,45*Math.PI/180);\nassert.ok(rolling.rearLateralForceScale>.90);\nassert.ok(locked20.rearLateralForceScale>.15);\nassert.ok(locked20.rearLateralForceScale<rolling.rearLateralForceScale-.10);\nassert.ok(locked45.rearLateralForceScale>locked20.rearLateralForceScale+.12);\nassert.equal(locked20.handbrakeSlidingMuRatio,.84);\nconsole.log("PASS Grip R1",{engaged,oneFrameRelease,partialRelease,settled,rollingRear:rolling.rearLateralForceScale,locked20Rear:locked20.rearLateralForceScale,locked45Rear:locked45.rearLateralForceScale});\n''')

          p=Path('.github/workflows/qa-dev-integration.yml'); s=p.read_text()
          s=once(s,"      - traffic/v21.31\n  workflow_dispatch:","      - traffic/v21.31\n      - grip/v21.31\n  workflow_dispatch:",'QA branch')
          s=once(s,"      - name: Driving dynamics simulation matrix\n        run: node qa/DEV_DRIVING_SIM_QA.mjs\n","      - name: Driving dynamics simulation matrix\n        run: node qa/DEV_DRIVING_SIM_QA.mjs\n      - name: Grip R1 physical handbrake recovery QA\n        run: node qa-grip-handbrake-r1.mjs\n",'QA step')
          p.write_text(s)
          PY

          node qa-grip-handbrake-r1.mjs
          node qa/DEV_DRIVING_SIM_QA.mjs

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/grip-r1-apply.yml .github/workflows/grip-r1-apply-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Grip R1: physical handbrake slip and progressive regrip"
          git push
