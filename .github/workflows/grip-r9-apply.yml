name: Apply Grip R9 independent braking cleanup

on:
  push:
    branches:
      - grip/v21.31-r9
    paths:
      - 'tools/apply-grip-r9.mjs'
      - 'qa-grip-braking-r9.mjs'
      - 'src/physics/longitudinal-control.js'
      - '.github/workflows/grip-r9-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply Grip R9
        run: node tools/apply-grip-r9.mjs
      - name: Grip R9 brake reverse J-turn QA
        run: node qa-grip-braking-r9.mjs
      - name: Existing braking, grip and J-turn gates
        run: |
          node qa-grip-braking-r8.mjs
          node qa-grip-countersteer-r7.mjs
          node qa-grip-handbrake-r1.mjs
          node qa-grip-steering-curve-r3.mjs
          node qa-grip-drift-r4.mjs
          node qa-grip-offroad-r5.mjs
          node qa-grip-jump-r6.mjs
          node qa/V21_21_17_BRAKING_MOMENTUM_QA.mjs
          node qa/V21_27_J_TURN_EXIT_DRIVE_QA.mjs
          node qa/V21_29_BODY_RELATIVE_TRANSMISSION_QA.mjs
          node qa/V21_29_DNR_BRAKE_SELECTOR_QA.mjs
          node qa/DEV_DRIVING_SIM_QA.mjs
          npm run qa:stress
      - name: Production build
        run: npm run build
      - name: Commit Grip R9
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/driving-runtime-base.js src/driving-runtime.js
          git commit -m "Grip R9: separate service brake from drivetrain direction"
          git push
